 Condividi, poi «Aggiungi alla schermata Home». <b>Android</b>, in Chrome: menu ⋮, poi «Installa app».</p><p class="note">Le classificate: il server le legge da R6 Arenyze ogni 15 minuti mentre giochi, ogni 4 ore quando non giochi. Se fra due letture giochi due partite, stanno sulla stessa riga.</p></section>',c=t.sd||we,s=Ke(c,t.sdDay),l=mt*s.w,d='<section class="card guide">'+Ct("d-calc","more","Come calcolo i numeri (per chi vuole i dettagli)",`<div class="setup-b"><p><b>1. Equilibrio nel flick.</b> Metto i round su un grafico: il numero usato contro (volte oltre − volte prima). La retta ai minimi quadrati pesati (il primo round di ogni allenamento, il riscaldamento, pesa la metà) incrocia lo zero nel punto di equilibrio. Il margine all'80% lo trovo ricampionando i round 400 volte e rifacendo la retta; lo mostro solo da `+Za+" round in su, perché con meno round viene troppo stretto.</p><p><b>2. Punteggio e rumore.</b> 40% colpi in testa nel flick, 20% tracking, 20% transizioni, 20% rinculo. Il rumore è quanto cambia il punteggio fra round fatti con gli stessi numeri e lo stesso analogico: per te ora "+P(c,1)+" punti a round (finché i round sono pochi parto da "+we+"). Una differenza fra due medie conta se supera 1,64 volte il suo errore: vuol dire essere sicuri al 90%. L'errore scende con più round, ma i round dello stesso allenamento contano meno di quelli di allenamenti diversi, perché hanno la stessa forma (dettagli qui sotto). Quando scelgo il migliore fra più numeri la soglia sale (1,96 con 3 numeri, 2,13 con 4), perché fra tanti uno sembra migliore anche per caso. Se un altro numero supera la soglia, mi sposto a metà strada.</p><p><b>3. Rinculo.</b> È una regola pratica, non un test: se in almeno 3 round il foro più alto arriva in media al 2° anello o oltre, alzo di circa il 5% (senza superare l'obiettivo di velocità).</p><p><b>4. Partite.</b> Per ogni numero sommo colpi in testa, uccisioni, morti e partite: colpi in testa come proporzione sulle uccisioni, K/D in scala logaritmica, uccisioni a partita come conteggio. Le serate variano più di quanto dicano i conteggi: misuro quanto (sovradispersione) e allargo il margine. Confronto il numero vicino al consiglio con quello che rende di più, a parità degli altri mirini, con almeno 2 sessioni e 4 partite ciascuno: se la differenza supera la soglia al 90% (più alta se hai provato 3 o più numeri) mi sposto verso quel numero, a metà strada, fino all'80% quando è molto netta. Se i due numeri li hai usati in periodi separati mi sposto la metà: in parte potrebbe essere il periodo. Ogni partita va con i numeri che avevi nella home quando l'hai giocata. Le vittorie le mostro ma non decidono.</p><p><b>5. Solo partite.</b> Senza round di flick per un mirino, parto dal numero che usi e mi sposto solo se in partita un altro numero rende chiaramente di più.</p><p><b>6. Obiettivo velocità.</b> Il numero più alto con cui vai oltre la testa al massimo "+wn+" volte su 20 più di quante ti fermi prima, fino al 15% sopra il consigliato, a passi di circa il 4%.</p><p><b>7. Gli altri mirini.</b> Consigliato = 1.0x × rapporto. Il rapporto di partenza è 0,62 + 0,38 / zoom (con 13 all'1.0x: 10 al 2.5x, 9 al 3.5x, 9 all'8.0x); è una regola di partenza, non una legge: i tuoi round con quel mirino lo rendono tuo, fino al 90%.</p><p><b>8. Analogico.</b> 4 round alternati: il tuo, Convesso alto, Convesso alto, il tuo. Così riscaldamento e stanchezza pesano uguale. Confronto i round dello stesso allenamento fra loro, così la forma del momento si cancella; il riscaldamento nel test non conta. Tieni il Convesso alto solo se fa più punti oltre la soglia (ora circa "+P(l,1)+" punti con 2 round per parte); altrimenti resti sul tuo. Con così pochi round si vedono solo differenze grandi: se vuoi, rifai il test. Se hai solo un analogico, spunta «Ho solo questo analogico» (in Oggi o in Progressi): il percorso salta il test e non ti consiglio di cambiarlo.</p><p><b>9. Quanto allenarsi.</b> Ti consiglio "+lr(c,t.sdDay)+" round per allenamento (il primo è il riscaldamento). Il numero viene dai tuoi dati: i round di fila hanno la stessa forma e ognuno dice un po' meno del precedente; mi fermo quando il prossimo varrebbe meno della metà di un round fatto in un altro allenamento. Ti dico «per adesso basta» anche se negli ultimi 2 round il punteggio scende oltre il rumore (stanchezza), e dopo "+Ht+" round di fila. Al massimo "+wa+" allenamenti al giorno, ad almeno "+Yt+` ore: più allenamenti brevi rendono più di uno lungo, sia per misurare sia per imparare.</p><p class="note">Durante il percorso il passo va dal 4% al 20% del numero. L'1.0x si chiude con due round di fila in equilibrio (differenza al massimo `+yt+"), dopo "+cn+" round, oppure quando lo chiudi tu: il numero del percorso è un punto di partenza (di solito entro ±1 da quello giusto), i round di mantenimento lo affinano. Livelli: 90% per decidere, 80% per i margini che vedi nei grafici, 95% per l'avviso sui due lati del flick.</p></div>")+"</section>",u=m=>'<span class="st-f">'+m+"</span>",p=m=>'<h4 class="st-h">'+m+"</h4>",f='<section class="card guide st">'+Ct("d-stat","more","Dettagli statistici: modelli, varianze e covarianze",`<div class="setup-b"><p class="note">n = round, k = allenamenti (round di fila, a meno di 3 ore uno dall'altro), N = partite, K/D/H = uccisioni/morti/colpi in testa, φ = sovradispersione, Δ = differenza fra due medie.</p>`+p("1. Equilibrio nel flick")+"<p>Retta ai minimi quadrati pesati fra il numero x e d = oltre − prima su 20. Pesi: 0,5 al primo round dell'allenamento, min(1, colpi/20) ai blocchi A/B.</p>"+u("x₀ = −a / b   (solo se b &gt; 0,05; x₀ in [0,8·min, 1,2·max] dei numeri provati)")+"<p>Margine 80%: bootstrap percentile dei round, 400 ricampionamenti, almeno 200 con b &gt; 0,05, solo da "+Za+" round. Niente formula Delta: ogni ricampionamento stima a e b insieme, quindi la loro covarianza è già dentro.</p>"+p("2. Punteggio e rumore")+u("punteggio = 100 · Σ peso·valore / Σ peso   (teste/20 0,4 · tracking 0,2 · transizioni 0,2 · rinculo 0,2)")+"<p>Il rumore è misurato sul punteggio totale, quindi le covarianze fra esercizi sono incluse. Modello a due livelli: punteggio = condizioni + allenamento + round (senza i round di riscaldamento).</p>"+u("sd² = (SS + "+fa+"·"+we+"²) / (gdl + "+fa+")   gruppi: stessi mirini e analogico, almeno 2 allenamenti")+u("w² = idem nello stesso allenamento (partenza 7),   τ² = max(0, sd² − w²)")+u("Var(media di n round in k allenamenti) = w²/n + τ²/k")+"<p>Per te ora: sd "+P(c,1)+", w "+P(s.w,1)+", τ "+P(s.tau,1)+". I round dello stesso allenamento sono correlati (stessa forma): con τ²/k non contano come indipendenti.</p>"+u("z = Δ / √(Var₁ + Var₂)   decido a |z| ≥ 1,645 (90%)")+"<p>Covarianza 0 fra i due gruppi: sono round diversi. Scegliendo il migliore fra m+1 numeri: z = Φ⁻¹(1 − 0,05/m) (Bonferroni: 1,96 con 3, 2,13 con 4), valido anche se i confronti sono correlati (qui hanno lo stesso riferimento).</p>"+p("3. Analogico: A B B A")+u("d_s = B̄_s − Ā_s,  w_s = 1/(1/nA,s + 1/nB,s),  Δ = Σ w_s·d_s / Σ w_s,  Var(Δ) = w² / Σ w_s")+"<p>Nello stesso allenamento Ā e B̄ hanno covarianza positiva (la forma del momento): la differenza appaiata la toglie invece di ignorarla. Il riscaldamento è escluso. Se nessun allenamento ha tutti e due: Var(Δ) = sd²·(1/nA + 1/nB).</p>"+p("4. Partite")+u("colpi in testa: p̂ = ΣH/ΣK,   Var(p̂) = φ·p(1−p)/ΣK")+"<p>Binomiale condizionata alle uccisioni; p limitata a 0,02–0,98 solo nella varianza.</p>"+u("K/D: l = ln((K+½)/(D+½)),   Var(l) = φ·(1/(K+½) + 1/(D+½))")+"<p>È la formula Delta, ma condizionando sul totale T = K + D: K | T ~ Binomiale(T, q) e l = logit(q̂). C'è una sola variabile casuale, quindi nessuna covarianza trattata come 0: Var(logit q̂) ≈ 1/(T·q(1−q)) = 1/K + 1/D. La dipendenza fra uccisioni e morti da una sera all'altra (sere buone: più K e meno D) fa variare q fra le sere e finisce in φ. Il +½ evita gli zeri (Haldane-Anscombe).</p>"+u("uccisioni a partita: m = ΣK/N,   Var(m) = φ·max(m; 0,5)/N   (Poisson, N = esposizione)")+u("φ = χ² di Pearson / gdl fra le sessioni dello stesso numero, in [1, 6]; 2 senza repliche")+"<p>La prima sessione dopo un cambio entra con i conteggi × 0,5 (verosimiglianza scontata), anche nelle varianze. Due numeri: z = (l_B − l_A)/√(Var_A + Var_B), covarianza 0 perché sono sessioni diverse; soglia 1,645 o Bonferroni. Spostamento del consiglio: min(0,8; 0,5 + 0,25·(z − soglia)), dimezzato se i due numeri sono di periodi separati (la tendenza nel tempo si confonde col numero). Intervalli nei grafici: ±1,28·se (80%), per il K/D ritrasformati con exp.</p>"+p("5. Quanti round per allenamento")+u("informazione di un allenamento con n round di misura ∝ n / (w² + n·τ²)")+u("valore del round n+1 / primo round di un altro allenamento = ρ(ρ+1) / ((ρ+n)(ρ+n+1)),  ρ = w²/τ²")+"<p>Aggiungo round finché questo rapporto è almeno 0,5, più il riscaldamento; massimo "+Ht+". Stanchezza: ultimi 2 round contro i precedenti dello stesso allenamento, z = Δ / (w·√(1/2 + 1/m)) ≤ −1,28. Per te ora ρ = "+(s.tau>0?P(s.w*s.w/(s.tau*s.tau),1):"∞")+".</p>"+p("6. Tendenze e altri test")+"<p>Allenamento: media di ogni allenamento, seconda metà contro prima (almeno 3 + 3), Welch. Settimane: Δ fra medie settimanali con Var = w²/n + τ²/k. Partite: ultime h sessioni contro le h prima (h ≤ 6), con i modelli del punto 4.</p>"+u("A/B: z = (r_A − r_B) / √(H_A/t_A² + H_B/t_B²)   (colpi in testa al minuto, Poisson, blocchi alternati)")+u("lati: colpo = +1 / −1 / 0,   Var(media) = (p_o + p_p − (p_o − p_p)²)/n,   avviso a |z| ≥ 1,96")+`<p class="note">Livelli: 90% per decidere, 80% per i margini, 95% per l'avviso dei lati. Cosa si assume e i limiti: round di allenamenti diversi e sessioni di partite diverse indipendenti fra loro; τ² è una stima per differenza (con pochi dati pesa il valore di partenza di `+we+" punti); con 2 + 2 round il test dell'analogico vede solo differenze grandi; due numeri usati in periodi diversi restano in parte confusi con il p
