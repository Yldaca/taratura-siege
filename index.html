/* ---------- numeri casuali ripetibili (per il margine: stessi dati, stesso risultato) ---------- */
function rng(seed){
  var a=seed>>>0;
  return function(){a=(a+0x6D2B79F5)>>>0;var t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};
}
/* Margine all'80% del punto di equilibrio: ricampiono i round di flick 400 volte e rifaccio la retta. */
function eqCI(pts,lo,hi){
  if(pts.length<4)return null;
  var seed=7;
  pts.forEach(function(p){seed=(Math.imul(seed,31)+Math.round(p.x*7)+Math.round((p.d+40)*13)+Math.round(p.w*5))|0;});
  var R=rng(seed),eqs=[];
  for(var it=0;it<400;it++){
    var S=[];
    for(var j=0;j<pts.length;j++){var p=pts[Math.floor(R()*pts.length)];S.push([p.x,p.d,p.w]);}
    var f=fitLine(S);
    if(f&&f.b>0.05)eqs.push(Math.max(lo*0.8,Math.min(hi*1.2,-f.a/f.b)));
  }
  if(eqs.length<200)return null;
  eqs.sort(function(a,b){return a-b;});
  return [Math.round(eqs[Math.floor(eqs.length*0.1)]),Math.round(eqs[Math.min(eqs.length-1,Math.floor(eqs.length*0.9))])];
}
/* Il primo round di ogni sera è il riscaldamento: conta la metà. */
function markWarm(rs){
  var seen={};
  rs.slice().sort(function(a,b){return (a.ts||0)-(b.ts||0);}).forEach(function(r){
    var d=r.day||'?';
    r.warm=!seen[d];seen[d]=1;
  });
  return rs;
}
function warmSet(){
  var seen={},w={};
  state.rounds.slice().sort(function(a,b){return (a.ts||0)-(b.ts||0);}).forEach(function(r){
    var d=r.day||'?';if(!seen[d]){seen[d]=1;w[r.ts]=1;}
  });
  return w;
}
/* Lati: colpo pari = da sinistra, dispari = da destra. */
function sideSplit(rs){
  var L={o:0,p:0,n:0},R={o:0,p:0,n:0};
  rs.forEach(function(r){
    var s=r.shots;if(!s||s.length<FLK_N)return;
    for(var i=0;i<s.length;i++){var X=(i%2)?R:L,c=s.charAt(i);X.n++;if(c==='o')X.o++;else if(c==='p')X.p++;}
  });
  if(L.n<20||R.n<20)return null;
  return {l:(L.o-L.p)/L.n*20,r:(R.o-R.p)/R.n*20,nl:L.n,nr:R.n};
}
function distSplit(rs){
  var g={};
  rs.forEach(function(r){if(!r.dist)return;(g[r.dist]=g[r.dist]||[]).push(r.d);});
  var out=[];
  DISTS.forEach(function(x){var L=g[x[0]];if(L&&L.length>=2)out.push({d:x[0],m:mean(L),n:L.length});});
  return out.length>=2?out:null;
}

/* ---------- screenshot del bersaglio ---------- */
/* Tocchi il centro, poi il bordo del cerchio più grande, poi ogni foro. Le fasce sono 4, larghe uguali: centro, 1°, 2°, 3° anello; oltre il bordo è "fuori".
   L'immagine non viene salvata: restano solo le posizioni dei fori, in proporzione al raggio. */
var shot=null;
function shotOpen(file){
  if(!file)return;
  var url;
  try{url=URL.createObjectURL(file);}catch(e){toast('Non riesco ad aprire l\'immagine');return;}
  var img=new Image();
  img.onload=function(){shot={url:url,w:img.naturalWidth,h:img.naturalHeight,step:'c',c:null,R:null,holes:[]};render();ovTop();};
  img.onerror=function(){try{URL.revokeObjectURL(url);}catch(e){}toast('Immagine non valida');};
  img.src=url;
}
function shotClose(){if(shot&&shot.url){try{URL.revokeObjectURL(shot.url);}catch(e){}}shot=null;render();}
function shotTap(e,el){
  if(!shot)return;
  var r=el.getBoundingClientRect();
  if(!r.width||!r.height)return;
  var x=(e.clientX-r.left)/r.width*shot.w,y=(e.clientY-r.top)/r.height*shot.h;
  if(shot.step==='c'){shot.c=[x,y];shot.step='r';}
  else if(shot.step==='r'){
    var R=Math.hypot(x-shot.c[0],y-shot.c[1]);
    if(R<shot.w*0.01)return;
    shot.R=R;shot.step='h';
  }else{if(shot.holes.length<150)shot.holes.push([x,y]);}
  render();
}
function shotUndo(){
  if(!shot)return;
  if(shot.step==='h'&&shot.holes.length)shot.holes.pop();
  else if(shot.step==='h'){shot.step='r';shot.R=null;}
  else if(shot.step==='r'){shot.step='c';shot.c=null;}
  render();
}
function ringOf(d){return d>1?4:Math.min(3,Math.floor(d*4));}
function shotResult(){
  var c=shot.c,R=shot.R;
  var H=shot.holes.map(function(h){return [Math.round((h[0]-c[0])/R*100)/100,Math.round((h[1]-c[1])/R*100)/100];});
  var inside=H.filter(function(h){return Math.hypot(h[0],h[1])<=1;}).length;
  var top=H.reduce(function(m,h){return (!m||h[1]<m[1])?h:m;},null);
  var mx=mean(H.map(function(h){return h[0];}));
  return {H:H,inside:inside,ring:top?ringOf(Math.hypot(top[0],top[1])):null,drift:Math.abs(mx)<0.15?0:(mx>0?1:-1),mx:mx,my:mean(H.map(function(h){return h[1];}))};
}
function shotDone(){
  if(!shot||!shot.holes.length)return;
  var s=shotResult();
  ensureDraft();
  draft.holes=s.H;
  draft.rec=Math.min(s.inside,draft.mag);
  draft.ring=s.ring;draft.drift=s.drift;
  saveDraft();
  var msg=s.inside+' fori dentro, il più alto: '+RING[s.ring].toLowerCase();
  shotClose();toast(msg);
}
function shotHtml(){
  var s=shot,step={c:'1. Tocca il centro del bersaglio',r:'2. Tocca il bordo del cerchio più grande',h:'3. Tocca ogni foro'}[s.step];
  var u=Math.max(s.w,s.h)/160,svg='';
  if(s.c&&s.R){for(var i=1;i<=4;i++)svg+='<circle cx="'+s.c[0]+'" cy="'+s.c[1]+'" r="'+(s.R*i/4)+'" class="sh-ring" stroke-width="'+u*0.6+'"/>';}
  if(s.c)svg+='<circle cx="'+s.c[0]+'" cy="'+s.c[1]+'" r="'+u*2.2+'" class="sh-c"/>';
  s.holes.forEach(function(h){svg+='<circle cx="'+h[0]+'" cy="'+h[1]+'" r="'+u*2.4+'" class="sh-h" stroke-width="'+u*0.7+'"/>';});
  var live='';
  if(s.step==='h'&&s.holes.length){var q=shotResult();live='<p class="res">'+s.holes.length+' fori · '+q.inside+' dentro · il più alto: '+esc(RING[q.ring].toLowerCase())+' · '+esc(driftName(q.drift).toLowerCase())+'</p>';}
  return '<div class="s-wrap"><div class="s-top"><span class="lbl">Screenshot del bersaglio</span><button class="btn ghost mini" data-act="shotclose" type="button">Chiudi</button></div>'+
    '<div class="s-body"><p class="ask">'+esc(step)+'</p>'+
    '<div class="sh-fig" data-act="shottap" role="button" aria-label="Immagine del bersaglio: tocca per segnare"><img src="'+esc(s.url)+'" alt="Screenshot del bersaglio" draggable="false">'+
    '<svg viewBox="0 0 '+s.w+' '+s.h+'" preserveAspectRatio="none" aria-hidden="true">'+svg+'</svg></div>'+live+
    '<div class="row-btn"><button class="btn ghost" data-act="shotundo" type="button"'+(s.step==='c'?' disabled':'')+'>Annulla l\'ultimo</button>'+
    '<button class="btn pri" data-act="shotdone" type="button"'+(s.holes.length?'':' disabled')+'>Fatto: usa questi fori</button></div>'+
    '<p class="hint">Ingrandisci con due dita se i fori sono piccoli. Le fasce sono 4, larghe uguali, dal centro al bordo.</p></div></div>';
}
/* Rosa dei colpi per arma, con gli ultimi 10 caricatori analizzati. */
var patW=null;
function patternCard(A){
  var rs=A.rs.filter(function(r){return r.holes&&r.holes.length;});

}

/* ---------- test del controller (Gamepad API del browser) ---------- */
/* Il browser legge il controller senza le impostazioni della PS5: sono misure indicative dell'hardware. */
var gpad={test:null,samples:[],t0:0,raf:0,res:{},prec:null};
function padList(){
  try{if(!navigator.getGamepads)return null;return Array.prototype.slice.call(navigator.getGamepads()||[]).filter(Boolean);}catch(e){return null;}
}
function padGet(){var L=padList();return (L&&L.length)?L[0]:null;}
try{
  window.addEventListener('gamepadconnected',function(){if(tab==='test')render();});
  window.addEventListener('gamepaddisconnected',function(){if(tab==='test')render();});
}catch(e){}
function axesOf(g){var a=g.axes||[];return {lx:a[0]||0,ly:a[1]||0,rx:a[2]||0,ry:a[3]||0};}
function padStart(kind){
  if(!padGet()){toast('Collega il controller e premi un tasto');return;}
  gpad.test=kind;gpad.samples=[];gpad.t0=performance.now();
  if(kind==='prec')precInit();
  try{cancelAnimationFrame(gpad.raf);}catch(e){}
  render();
  gpad.raf=requestAnimationFrame(padLoop);
}
function padStop(){gpad.test=null;try{cancelAnimationFrame(gpad.raf);}catch(e){}render();}
function padLoop(){
  var g=padGet();
  if(!g||!gpad.test){gpad.test=null;render();return;}
  var A=axesOf(g),el=performance.now()-gpad.t0;
  if(gpad.test==='drift'||gpad.test==='range'){
    gpad.samples.push(A);
    var e=$('pad-left');if(e)e.textContent=Math.max(0,Math.ceil((5000-el)/1000))+' s';
    if(el>=5000){padFinish();return;}
  }else if(gpad.test==='prec'){if(precStep(A))return;}
  gpad.raf=requestAnimationFrame(padLoop);
}
function q95(a){a=a.slice().sort(function(x,y){return x-y;});return a.length?a[Math.min(a.length-1,Math.floor(0.95*a.length))]:0;}
function reach(xs,ys){
  var sec=[],i;
  for(i=0;i<16;i++)sec.push(0);
  xs.forEach(function(x,j){
    var y=ys[j],m=Math.hypot(x,y);
    if(m<0.3)return;
    var k=Math.floor(((Math.atan2(y,x)+Math.PI)/(2*Math.PI))*16)%16;
    if(m>sec[k])sec[k]=m;
  });
  var got=sec.filter(function(v){return v>0;});
  return {cov:got.length,min:got.length?Math.round(Math.min.apply(null,got)*100):0,max:got.length?Math.round(Math.max.apply(null,got)*100):0};
}
function padFinish(){
  var S=gpad.samples;
  if(gpad.test==='drift'){
    gpad.res.drift={l:Math.round(q95(S.map(function(s){return Math.hypot(s.lx,s.ly);}))*1000)/10,r:Math.round(q95(S.map(function(s){return Math.hypot(s.rx,s.ry);}))*1000)/10};
  }else{
    gpad.res.range={l:reach(S.map(function(s){return s.lx;}),S.map(function(s){return s.ly;})),r:reach(S.map(function(s){return s.rx;}),S.map(function(s){return s.ry;}))};
  }
  gpad.test=null;render();
}
var PREC_N=8,PREC_W=320,PREC_H=200,PREC_R=14,PREC_HOLD=400;
function precInit(){
  var R=rng((Date.now()&0xffff)+1),T2=[];
  for(var i=0;i<PREC_N;i++)T2.push({x:30+R()*(PREC_W-60),y:30+R()*(PREC_H-60)});
  var now=performance.now();
  gpad.prec={x:PREC_W/2,y:PREC_H/2,tg:T2,i:0,inSince:0,over:0,times:[],tStart:now,last:now};
}
function precStep(A){
  var p=gpad.prec,now=performance.now(),dt=Math.min(0.05,(now-p.last)/1000);p.last=now;
  var dz=0.1,m=Math.hypot(A.rx,A.ry),vx=0,vy=0;
  if(m>dz){var k=Math.pow((m-dz)/(1-dz),1.6)/m*260;vx=A.rx*k;vy=A.ry*k;}
  p.x=Math.max(0,Math.min(PREC_W,p.x+vx*dt));p.y=Math.max(0,Math.min(PREC_H,p.y+vy*dt));
  var t=p.tg[p.i],inside=Math.hypot(p.x-t.x,p.y-t.y)<=PREC_R;
  if(inside){
    if(!p.inSince)p.inSince=now;
    if(now-p.inSince>=PREC_HOLD){
      p.times.push((now-p.tStart)/1000);p.i++;p.inSince=0;p.tStart=now;buzz(15);
      if(p.i>=PREC_N){
        gpad.res.prec={time:Math.round(mean(p.times)*100)/100,over:Math.round(p.over/PREC_N*100)/100};
        gpad.test=null;render();return true;
      }
    }
  }else if(p.inSince){p.over++;p.inSince=0;}
  var cu=$('pc-cur'),tg=$('pc-tgt'),nn=$('pc-n');
  if(cu){cu.setAttribute('cx',p.x.toFixed(1));cu.setAttribute('cy',p.y.toFixed(1));}
  if(tg&&p.tg[p.i]){tg.setAttribute('cx',p.tg[p.i].x.toFixed(1));tg.setAttribute('cy',p.tg[p.i].y.toFixed(1));tg.setAttribute('class','pc-t'+(p.inSince?' in':''));}
  if(nn)nn.textContent=(p.i+1)+' / '+PREC_N;
  return false;
}
function dzAdvice(drift,cur,name){
  var need=Math.ceil(drift+2);
  return name+': deriva '+nf(drift,1)+'%. Zona morta di almeno '+need+'%'+(cur!==undefined?(cur>=need?' (nel tuo setup '+cur+'%: va bene).':' (nel tuo setup '+cur+'%: alzala).'):'.');
}
function padCard(){

      '<circle id="pc-tgt" class="pc-t" cx="'+t.x+'" cy="'+t.y+'" r="'+PREC_R+'"/><circle id="pc-cur" class="pc-c" cx="'+p.x+'" cy="'+p.y+'" r="5"/></svg>'+
      '<p class="res" id="pc-n">'+(p.i+1)+' / '+PREC_N+'</p><button class="btn ghost" data-act="padstop" type="button">Interrompi</button></div>';

, 'type', 'name', 'key', 'season', 'seasonid', 'seasonyear', 'platform', 'platformfamily']);\n\nclass Err extends Error {\n  constructor(status, code, msg) { super(msg); this.status = status; this.code = code; }\n}\n\n/* ---------- configurazione ---------- */\nfunction cfg(env) {\n  const s = (v, d) => (v === undefined || v === null || String(v).trim() === '') ? d : String(v).trim();\n  return {\n    key: s(env.API_KEY, ''),\n    token: s(env.APP_TOKEN, ''),\n    name: s(env.UBI_NAME, ''),\n    platform: s(env.PLATFORM, 'psn').toLowerCase(),\n    modes: s(env.MODES, 'ranked').toLowerCase(),\n    season: s(env.SEASON, ''),\n    budget: Math.max(100, Number(env.MONTHLY_BUDGET) || 1800),\n    gap: Math.max(30, Number(env.GAP_MIN) || 120) * MIN,\n    path: s(env.STATS_PATH, ''),\n    origins: s(env.ALLOWED_ORIGINS, '*').split(',').map(x => x.trim()).filter(Boolean)\n  };\n}\nfunction missing(c) {\n  const m = [];\n  if (!c.key) m.push('API_KEY');\n  if (!c.name) m.push('UBI_NAME');\n  if (!['psn', 'xbl', 'uplay'].includes(c.platform)) m.push('PLATFORM (psn, xbl o uplay)');\n  return m;\n}\n\n/* ---------- database ---------- */\nconst readyDBs = new WeakSet();\nasync function setup(env) {\n  if (env.DB && readyDBs.has(env.DB)) return;\n  if (!env.DB) throw new Err(500, 'no_db', 'Manca il database: collega D1 al Worker con il nome variabile DB.');\n  await env.DB.batch([\n    env.DB.prepare('CREATE TABLE IF NOT EXISTS snaps (ts INTEGER PRIMARY KEY, prev INTEGER, path TEXT, kills INTEGER, deaths INTEGER, headshots INTEGER, matches INTEGER, wins INTEGER, losses INTEGER, abandons INTEGER)'),\n    env.DB.prepare('CREATE TABLE IF NOT EXISTS meta (k TEXT PRIMARY KEY, v TEXT)')\n  ]);\n  readyDBs.add(env.DB);\n}\nasync function getMeta(env) {\n  const r = await env.DB.prepare(\"SELECT k, v FROM meta WHERE k <> 'raw'\").all();\n  const m = {};\n  for (const row of (r.results || [])) { try { m[row.k] = JSON.parse(row.v); } catch (e) { /* valore rovinato: lo ignoro */ } }\n  return m;\n}\nasync function putMeta(env, m) {\n  const st = env.DB.prepare('INSERT OR REPLACE INTO meta (k, v) VALUES (?, ?)');\n  await env.DB.batch(Object.keys(m).map(k => st.bind(k, JSON.stringify(m[k] === undefined ? null : m[k]))));\n}\nasync function putRaw(env, txt) {\n  await env.DB.prepare(\"INSERT OR REPLACE INTO meta (k, v) VALUES ('raw', ?)\").bind(txt.length > 1000000 ? txt.slice(0, 1000000) : txt).run();\n}\nasync function getRaw(env) {\n  const r = await env.DB.prepare(\"SELECT v FROM meta WHERE k = 'raw'\").first();\n  return r ? r.v : null;\n}\nfunction monthKey(t) { const d = new Date(t); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0'); }\nfunction callsThisMonth(meta, now) { return meta.month === monthKey(now) ? (meta.calls || 0) : 0; }\n\n/* ---------- lettura dei totali, qualunque sia la forma della risposta ---------- */\nfunction num(v) {\n  if (typeof v === 'number' && isFinite(v)) return v;\n  if (typeof v === 'string' && /^\\s*-?\\d+(\\.\\d+)?\\s*$/.test(v)) return Number(v);\n  if (v && typeof v === 'object' && !Array.isArray(v) && 'value' in v) return num(v.value);\n  return null;\n}\nfunction nk(k) { return String(k).toLowerCase().replace(/[^a-z]/g, ''); }\nfunction fieldsOf(o) {\n  const f = {};\n  if (!o || typeof o !== 'object' || Array.isArray(o)) return f;\n  for (const k in o) {\n    const m = KEYMAP[nk(k)];\n    if (m && f[m] === undefined) { const n = num(o[k]); if (n !== null && n >= 0) f[m] = n; }\n  }\n  const mo = o.match_outcomes || o.matchOutcomes;\n  if (mo && typeof mo === 'object') {\n    for (const k of ['wins', 'losses', 'abandons']) { if (f[k] === undefined) { const n = num(mo[k]); if (n !== null && n >= 0) f[k] = n; } }\n  }\n  return f;\n}\nfunction atPath(root, path) {\n  if (!path || path === '.') return root;\n  const parts = path.match(/\\.[^.[\\]]+|\\[\\d+\\]/g);\n  if (!parts || parts.join('') !== path) return undefined;\n  let o = root;\n  for (const p of parts) {\n    if (o === nu \n    for (const k of FIELDS) { if (d[k] === null) cur[k] = null; else if (cur[k] !== null) cur[k] += d[k]; }\n    cur.end = b.ts;\n    lastChange = b.ts;\n  }\n  const now = Date.now();\n  out.forEach(s => { s.open = now - s.end < c.gap; });\n  return out;\n}\n\n/* ---------- controllo programmato ---------- */\nasync function tick(env) {\n  const c = cfg(env);\n  if (!c.token || missing(c).length || !env.DB) return;\n  await setup(env);\n  const meta = await getMeta(env);\n  const now = Date.now();\n  const calls = callsThisMonth(meta, now);\n  if (calls >= c.budget) return;\n  const active = meta.last_change && now - meta.last_change < 90 * MIN;\n  let every = active ? 15 : 60;\n  if (calls >= c.budget * 0.85) every = active ? 30 : 180;\n  if (meta.last_call && now - meta.last_call < (every - 2) * MIN) return;\n  await poll(env, c, meta, 'cron');\n}\n\n/* ---------- risposte HTTP ---------- */\nfunction corsHeaders(c, origin) {\n  const h = { 'Access-Control-Allow-Methods': 'GET, POST, OPTIONS', 'Access-Control-Allow-Headers': 'Authorization, Content-Type', 'Access-Control-Max-Age': '86400' };\n  if (c.origins.includes('*')) h['Access-Control-Allow-Origin'] = '*';\n  else if (origin && c.origins.includes(origin)) { h['Access-Control-Allow-Origin'] = origin; h['Vary'] = 'Origin'; }\n  return h;\n}\nfunction json(o, status, cors) {\n  return new Response(JSON.stringify(o), { status, headers: Object.assign({ 'content-type': 'application/json; charset=utf-8', 'cache-control': 'no-store' }, cors) });\n}\nfunction sameText(a, b) {\n  if (typeof a !== 'string' || typeof b !== 'string' || a.length !== b.length) return false;\n  let r = 0;\n  for (let i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i);\n  return r === 0;\n}\nfunction authOk(req, token) {\n  const h = req.headers.get('Authorization') || '';\n  return sameText(h, 'Bearer ' + token);\n}\nfunction status(c, meta) {\n  const now = Date.now();\n  return {\n    v: VERSION, name: c.name, platform: c.platform, modes: c.modes,\n    lastCall: meta.last_call || null, lastOk: meta.last_ok || null, lastChange: meta.last_change || null,\n    lastError: meta.last_error || null, calls: callsThisMonth(meta, now), budget: c.budget,\n    fields: meta.fields || [], path: meta.path || null,\n    active: !!(meta.last_change && now - meta.last_change < 90 * MIN)\n  };\n}\n\nexport default {\n  async fetch(req, env, ctx) {\n    const c = cfg(env);\n    const url = new URL(req.url);\n    const cors = corsHeaders(c, req.headers.get('Origin') || '');\n    if (req.method === 'OPTIONS') return new Response(null, { status: 204, headers: cors });\n    try {\n      if (url.pathname === '/' || url.pathname === '/health') return json({ ok: true, app: 'taratura-siege', v: VERSION }, 200, cors);\n      if (!c.token) return json({ ok: false, error: 'no_token', msg: 'Manca APP_TOKEN nelle impostazioni del Worker.' }, 500, cors);\n      if (c.token.length < 16) return json({ ok: false, error: 'weak_token', msg: 'APP_TOKEN e\\' troppo corto: usa quello generato dall\\'app.' }, 500, cors);\n      if (!authOk(req, c.token)) return json({ ok: false, error: 'auth', msg: 'Codice personale sbagliato.' }, 401, cors);\n      const miss = missing(c);\n      if (miss.length) return json({ ok: false, error: 'config', missing: miss, msg: 'Mancano nelle impostazioni del Worker: ' + miss.join(', ') }, 500, cors);\n      await setup(env);\n      const meta = await getMeta(env);\n      if (url.pathname === '/status') return json({ ok: true, status: status(c, meta) }, 200, cors);\n      if (url.pathname === '/sessions') {\n        const since = Math.max(0, Math.floor(Number(url.searchParams.get('since')) || 0));\n        return json({ ok: true, sessions: await sessions(env, c, since), status: status(c, meta) }, 200, cors);\n      }\n      if (url.pathname === '/refresh' && req.method === 'POST') {\n        if (meta.last_call && Date.now() - meta.last_call < 5 * MIN) return json({ ok: true, polled: false, reason: 'recent', status: status(c, meta) }, 200, cors);\n        const r = await poll(env, c, meta, 'manual');\n        return json({ ok: true, polled: r.ok, reason: r.reason || null, status: status(c, meta) }, 200, cors);\n      }\n      if (url.pathname === '/test') {\n        let polled = false;\n        let rawTxt = await getRaw(env);\n        if ((url.searchParams.get('fresh') === '1' || !rawTxt) && (!meta.last_call || Date.now() - meta.last_call >= MIN)) {\n          await poll(env, c, meta, 'test');\n          polled = true;\n          rawTxt = await getRaw(env);\n        }\n        let raw = null;\n        try { raw = rawTxt ? JSON.parse(rawTxt) : null; } catch (e) { raw = null; }\n        const p = raw ? pickStats(raw, c, null, null) : null;\n        return json({\n          ok: true, polled,\n          extracted: p ? { path: p.path, ctx: p.ctx, fields: p.f, count: p.count } : null,\n          candidates: raw ? candidates(raw).slice(0, 15).map(x => ({ path: x.path, ctx: x.ctx.slice(0, 100), fields: x.f })) : [],\n          keys: raw ? keyTree(raw) : null,\n          status: status(c, meta)\n        }, 200, cors);\n      }\n      return json({ ok: false, error: 'not_found' }, 404, cors);\n    } catch (e) {\n      return json({ ok: false, error: e.code || 'error', msg: e.message || String(e) }, e.status || 500, cors);\n    }\n  },\n  async scheduled(controller, env, ctx) {\n    ctx.waitUntil(tick(env).catch(() => {}));\n  }\n};\n";
/* ---------- statistiche automatiche: collegamento al Worker ---------- */
/* L'app chiede al tuo Worker Cloudflare le sessioni ricavate dai totali di R6 Arenyze.
   Il Worker legge il servizio al massimo ogni 15 minuti; l'app chiede al Worker ogni 5 minuti
   mentre è aperta (al Worker non costa niente: legge solo il suo database). */
var LIVE_POLL=5*60000;
var live={busy:false,err:null,st:null,last:0,timer:null,user:null,test:null,testing:false,pending:false};
function liveCfg(){var p=state.prefs&&state.prefs.live;return p||{url:'',token:'',on:false,since:0,hidden:[]};}
function liveSet(){
  state.prefs=state.prefs||{};
  if(!state.prefs.live)state.prefs.live={url:'',token:'',on:false,since:0,hidden:[]};
  return state.prefs.live;
}
function liveReady(){var c=liveCfg();return !!(c.on&&c.url&&c.token);}
function liveBase(u){u=String(u||'').trim();if(u&&!/^https?:\/\//i.test(u))u='https://'+u;return u.replace(/\/+$/,'');}
function liveOkUrl(u){try{var x=new URL(liveBase(u));return x.protocol==='https:'&&/\./.test(x.hostname)&&!x.search&&!x.hash;}catch(e){return false;}}
function newToken(){
  var a=new Uint8Array(24),s='';
  crypto.getRandomValues(a);
  for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function liveFetch(path,opt){
  var c=liveCfg();opt=opt||{};
  var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  var tm=setTimeout(function(){if(ctl)ctl.abort();},15000);
  function fail(msg,code){var e=new Error(msg);e.code=code;return e;}
  return fetch(liveBase(opt.url||c.url)+path,{method:opt.method||'GET',headers:{'Authorization':'Bearer '+(opt.token||c.token)},cache:'no-store',signal:ctl?ctl.signal:undefined})
    .then(function(r){
      return r.text().then(function(t){
        clearTimeout(tm);
        var j=null;try{j=JSON.parse(t);}catch(e){j=null;}
        if(!j||typeof j!=='object')throw fail('All\'indirizzo risponde qualcosa, ma non è il Worker di Taratura: hai incollato il codice e premuto Deploy?','notours');
        if(!r.ok||j.ok===false)throw fail(j.msg||('Il Worker risponde con errore '+r.status+'.'),j.error||('http'+r.status));
        return j;
      });
    },function(e){
      clearTimeout(tm);
      if(e&&e.code)throw e;
      throw fail(e&&e.name==='AbortError'?'Il Worker non risponde: tempo scaduto.':'Il Worker non si raggiunge: controlla l\'indirizzo e la connessione.','net');
    });
}
function liveErrText(e){
  if(!e)return '';
  if(e.code==='auth')return 'Il codice personale non coincide con APP_TOKEN del Worker: copialo di nuovo dal passo 5.';
  return e.message||String(e);
}

/* sessioni del Worker -> righe di "Le tue partite" */
function liveMerge(S){
  var c=liveSet(),hid=c.hidden||[],ch=false,maxId=c.since||0;
  S.forEach(function(s){
    var id=String(s&&s.id||'');if(!/^\d{1,16}$/.test(id))return;
    var idn=Number(id);if(idn>maxId)maxId=idn;
    if(hid.indexOf(id)>=0)return;
    var k=Math.max(0,Math.round(Number(s.kills)||0)),d=Math.max(0,Math.round(Number(s.deaths)||0));
    var h=(s.headshots===null||s.headshots===undefined||!isFinite(Number(s.headshots)))?null:Math.max(0,Math.round(Number(s.headshots)));
    var n=Math.max(0,Math.round(Number(s.matches)||0));
    if(n<=0&&k+d<=0)return;
    var start=Number(s.start)||idn,day=dkey(new Date(start));
    var ex=null;
    for(var i=0;i<state.matches.length;i++){if(state.matches[i].id===id){ex=state.matches[i];break;}}
    var e={ts:ex?ex.ts:start,day:ex?ex.day:day,hs:(h!==null&&k>0)?Math.round(Math.min(h,k)/k*1000)/10:null,
      kd:d>0?Math.min(10,Math.round(k/d*100)/100):(k>0?Math.min(10,k):null),n:n>0?Math.min(300,n):null,
      s:ex?ex.s:sensOn(day),src:'auto',id:id,open:!!s.open,k:k,d:d,h:h};
    if(!ex){state.matches.push(e);ch=true;}
    else if(JSON.stringify(ex)!==JSON.stringify(e)){Object.keys(e).forEach(function(q){ex[q]=e[q];});ch=true;}
  });
  if(maxId!==(c.since||0)){c.since=maxId;ch=true;}
  return ch;
}
function liveSync(force){
  if(!me||live.busy||!liveReady())return Promise.resolve();
  var who=me.id,note=null;
  live.busy=true;livePaint();
  var first=force?liveFetch('/refresh',{method:'POST'}).then(function(j){
    note=j.polled?'Statistiche lette adesso':j.reason==='recent'?'Le statistiche sono state lette meno di 5 minuti fa':j.reason==='budget'?'Limite mensile di letture raggiunto':null;
  },function(e){if(e.code==='net'||e.code==='notours'||e.code==='auth')throw e;}):Promise.resolve();
  return first.then(function(){return liveFetch('/sessions?since='+(liveCfg().since||0));})
    .then(function(j){
      if(!me||me.id!==who)return;
      live.st=j.status||null;live.err=null;live.last=Date.now();
      if(liveMerge(j.sessions||[])){state.rev+=1;saveLocal();live.dirty=true;}
    })
    .catch(function(e){if(me&&me.id===who){live.err=liveErrText(e);live.last=Date.now();}})
    .then(function(){
      live.busy=false;
      if(note&&force)toast(note);
      if(live.dirty){live.dirty=false;softRender();}else livePaint();
    });
}
/* non ridisegnare mentre scrivi in un campo: aspetta che tu esca */
function softRender(){
  var a=document.activeElement,v=$('view');
  if(a&&a!==document.body&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&v&&v.contains(a)){live.pending=true;livePaint();return;}
  live.pending=false;render();
}
function liveTick(){
  if(!me||!liveReady()||live.busy)return;
  if(typeof document.visibilityState==='string'&&document.visibilityState!=='visible')return;
  if(Date.now()-live.last>=LIVE_POLL-5000)liveSync(false);
}
function liveBoot(){
  if(me&&live.user!==me.id){live.user=me.id;live.last=0;live.err=null;live.st=null;live.test=null;}
  if(!live.timer){
    live.timer=setInterval(liveTick,30000);
    document.addEventListener('visibilitychange',liveTick);
    document.addEventListener('focusout',function(){
      if(!live.pending)return;
      setTimeout(function(){
        var a=document.activeElement;
        if(live.pending&&!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){live.pending=false;render();}
      },300);
    });
  }
  if(!live.last)setTimeout(liveTick,0);
}

/* ---------- pezzi di interfaccia ---------- */
function whenTxt(t){
  if(!t)return 'mai';
  var d=new Date(t),hm=pad(d.getHours())+':'+pad(d.getMinutes());
  if(dkey(d)===dkey(new Date()))return 'oggi alle '+hm;
  var y=new Date();y.setDate(y.getDate()-1);
  if(dkey(d)===dkey(y))return 'ieri alle '+hm;
  return mDate(dkey(d))+' alle '+hm;
}
function liveBarInner(){
  var st=live.st,cls='',msg='';
  if(live.busy){cls='busy';msg='Controllo le statistiche…';}
  else if(live.err){cls='err';msg=esc(live.err);}
  else if(st&&st.lastError&&(!st.lastOk||st.lastError.ts>st.lastOk)){cls='err';msg='Il Worker segnala: '+esc(st.lastError.msg||'errore');}
  else if(st){
    cls=st.active?'on':'ok';
    msg='Ultima lettura '+esc(whenTxt(st.lastCall))+(st.active?' · <b>stai giocando</b>: controllo ogni 15 minuti':'');
    if(st.fields&&st.fields.length&&st.fields.indexOf('headshots')<0)msg+='<br><span class="lv-sub">Il servizio non dà i colpi in testa: arrivano K/D e partite.</span>';
  }else{msg='In attesa del primo controllo…';}
  if(live.pending)msg+='<br><span class="lv-sub">Sessioni nuove: le mostro appena finisci di scrivere.</span>';
  var calls=st&&st.budget?'<span class="lv-sub">Letture questo mese: '+nf(st.calls,0)+' su '+nf(st.budget,0)+'</span>':'';
  return '<span class="lv-dot '+cls+'" aria-hidden="true"></span><span class="lv-txt"><b>Automatico</b> · '+msg+(calls?'<br>'+calls:'')+'</span>'+
    '<button class="btn ghost mini" data-act="lvsync" type="button"'+(live.busy?' disabled':'')+'>Aggiorna</button>';
}
function liveBar(){return '<div class="lv-bar" id="lv-bar" role="status" aria-live="polite">'+liveBarInner()+'</div>';}
function livePaint(){var b=$('lv-bar');if(b)b.innerHTML=liveBarInner();var t=$('lv-res');if(t)t.innerHTML=liveTestHtml();}

function liveTestHtml(){
  if(live.testing)return '<p class="hint">Provo il collegamento… la prima volta il Worker legge anche il servizio, ci vuole qualche secondo.</p>';
  var T=live.test;if(!T)return '';
  if(T.err)return '<div class="lv-res bad"><p><b>Non va ancora.</b> '+esc(T.err)+'</p></div>';
  var st=T.status||{},ex=T.extracted,f=ex?ex.fields:{};
  var plat={psn:'PlayStation',xbl:'Xbox',uplay:'PC'}[st.platform]||st.platform;
  function row(k,lbl){var ok=f&&f[k]!==undefined;return '<li class="'+(ok?'ok':'no')+'"><span aria-hidden="true">'+(ok?'✓':'✕')+'</span> '+lbl+(ok?' <span class="mono">'+esc(String(f[k]))+'</span>':'')+'</li>';}
  var err=st.lastError&&(!st.lastOk||st.lastError.ts>st.lastOk)?'<p class="hint err">Ultimo errore del Worker: '+esc(st.lastError.msg||'')+'</p>':'';
  if(!ex)return '<div class="lv-res bad"><p><b>Il Worker risponde, ma non trova i tuoi totali.</b></p>'+err+'<p class="hint">Controlla UBI_NAME e PLATFORM nelle impostazioni del Worker, poi riprova.</p></div>';
  var hsOk=f.headshots!==undefined;
  return '<div class="lv-res good"><p><b>Collegato</b> a '+esc(st.name||'')+' su '+esc(plat||'')+(st.modes&&st.modes!=='all'?', '+esc(st.modes==='ranked'?'classificate':st.modes):'')+'. Totali trovati:</p>'+
    '<ul class="lv-f">'+row('kills','Uccisioni')+row('deaths','Morti')+row('headshots','Colpi in testa')+row('matches','Partite')+'</ul>'+
    (hsOk?'':'<p class="hint">Senza colpi in testa arrivano solo K/D e partite; la % di colpi in testa puoi ancora scriverla a mano.</p>')+
    (ex.count>1?'<p class="hint">Nella risposta ci sono '+ex.count+' blocchi di totali: ho preso quello delle classificate con più partite. Se i numeri non tornano con R6 Tracker, dimmelo.</p>':'')+err+
    (liveCfg().on?'':'<button class="btn pri block" data-act="lvon" type="button">Attiva le statistiche automatiche</button>')+'</div>';
}
function tokOther(id){

function copyText(t){
  function legacy(){
    var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand('copy');}catch(e){ok=false;}
    document.body.removeChild(ta);return ok;
  }
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t).then(function(){return true;},function(){return legacy();});
  return Promise.resolve(legacy());
}

      if(draft.rec!==null)draft.rec=Math.min(draft.rec,draft.mag);
    }
    else if(k==='rec'){draft.rec=clampInt((draft.rec===null?0:draft.rec)+d,0,draft.mag);}
    else{
      draft.shots=null;
      if(draft.a===null)draft.a=0;
      if(draft.b===null)draft.b=0;
      var o2=(k==='a')?'b':'a';
      draft[k]=Math.max(0,Math.min(20-draft[o2],draft[k]+d));
    }
    saveDraft();render();return;
  }
  if(a==='sens'){
    ensureDraft();P=computePlan();
    k=el.dataset.k;
    if(PERS_KEYS.indexOf(k)>-1){state.carry[k]=clampV(P.vals[k]+Number(el.dataset.d));commit();return;}
    var cur=(draft.sens[k]!==undefined)?draft.sens[k]:P.vals[k];
    draft.sens[k]=clampV(cur+Number(el.dataset.d));
    saveDraft();render();return;
  }
  if(a==='sensreset'){ensureDraft();draft.sens={};saveDraft();render();return;}
  if(a==='ads8reset'){delete state.carry.ads8;commit();toast('8.0x ricalcolato');return;}
  if(a==='gearn'){
    k=el.dataset.k;
    var lim=(k==='rm'||k==='lm')?[-10,10]:[0,30];
    var g=Object.assign({},state.gear);
    g[k]=Math.max(lim[0],Math.min(lim[1],g[k]+Number(el.dataset.d)));
    state.gear=normGear(g);
    commit();return;
  }
  if(a==='save'){
    P=computePlan();
    ensureDraft();
    if(draft.trk===null||draft.a===null||draft.b===null||draft.swi===null||draft.rec===null)return;
    if(DRILLS.some(function(X){return !drillDone(X);}))return;
    var maint=P.finished,idx=P.cur,def=maint?null:P.stages[P.cur].def;
    var used=usedSens(P),setup=Object.assign({},state.gear);
    SENS_KEYS.forEach(function(q){setup[q]=used[q];});
    var now=new Date();
    var round={stage:maint?'free':def.id,value:null,a:draft.a,b:draft.b,trk:draft.trk,pre:null,swi:draft.swi,rec:draft.rec,recN:draft.mag,
      ring:draft.ring,drift:draft.drift,dist:null,shots:draft.shots||null,swiSeq:draft.swiSeq||null,holes:draft.holes||null,
      op:canonOp(draft.op),wep:txt(draft.wep),at:fmtD(now),day:dkey(now),ts:now.getTime(),setup:normSetup(setup),focus:null};
    if(maint)round.focus=curFocus();
    else if(def.kind==='cap')round.value=state.gear.rcap;
    else{round.value=used[def.id];round.focus=def.id;}
    round.dist=distKey(maint?defFor(round.focus):def);
    state.rounds.push(round);
    state.kit={op:round.op,wep:round.wep,mag:draft.mag};
    state.seen=1;
    var keepF=maint?round.focus:null;
    draft=blankDraft();draft.focus=keepF;saveDraft();dstep=0;tResetAll();
    if(sess){voiceStop();sess=null;}
    commit();
    var msg='Round salvato';
    if(!maint){
      var s2=computePlan().stages[idx];
      msg=s2.done?('Fase chiusa: '+fv(s2.def.id,s2.final)):('Prossimo numero: '+(s2.def.kind==='cap'?capName('convessa'):s2.next));
    }
    toast(msg);toTop();
    return;
  }
  if(a==='lock'){
    P=computePlan();
    if(P.finished)return;
    st=P.stages[P.cur];
    if(st.def.kind==='cap'||!st.rounds.length)return;
    state.locks[st.def.id]=st.rounds[st.rounds.length-1].value;
    commit();toast('Fase chiusa: '+state.locks[st.def.id]);toTop();return;
  }
  if(a==='setcap'){
    state.gear=normGear(Object.assign({},state.gear,{rcap:el.dataset.v}));
    commit();toast('Montata: '+capName(el.dataset.v));return;
  }
  if(a==='view'){viewStage=el.dataset.s;render();return;}
  if(a==='day'){calDay=el.dataset.k;render();return;}
  if(a==='cal'){
    var dd=Number(el.dataset.d);
    if(dd===0){var n0=new Date();calMonth=new Date(n0.getFullYear(),n0.getMonth(),1);calDay=dkey(n0);}
    else calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+dd,1);
    render();return;
  }
  if(a==='anp'){
    anP=el.dataset.p;
    if(anP==='custom'&&!anFrom&&!anTo){
      var ds=state.rounds.filter(function(r){return r.day;}).map(function(r){return r.day;}).sort();
      if(ds.length){anFrom=ds[0];anTo=ds[ds.length-1];}
    }
    render();return;
  }
  if(a==='applycomfort'){
    P=computePlan();
    if(!P.finished)return;
    var Mx=sensModel(analyze(P),P),nch=0;
    OPT_IDS.forEach(function(q){if(Mx[q].comfort!==null){state.carry[q]=Mx[q].comfort;nch++;}});
    if(nch){draft=blankDraft();saveDraft();commit();toast('Valori di comfort applicati');}
    return;
  }
  if(a==='applytweak'){
    state.carry[el.dataset.k]=clampInt(el.dataset.v,1,100);
    draft=blankDraft();saveDraft();
    commit();toast(KEY_NAME[el.dataset.k]+': '+state.carry[el.dataset.k]);return;
  }
  if(a==='copy'){
    var tc=$('bk');
    if(!tc)return;
    tc.focus();tc.select();
    var done=false;
    try{done=document.execCommand('copy');}catch(e){}
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(tc.value).then(function(){},function(){});
        done=true;
      }
    }catch(e){}
    toast(done?'Backup copiato':'Seleziona il testo e copialo a mano');
    return;
  }
  if(a==='import'){
    var ta=$('bk-in');
    if(!ta||!ta.value.trim()){toast('Incolla prima il backup');return;}
    try{
      var o3=JSON.parse(ta.value);
      var ns=normalize(o3);
      ns.rev=Math.max(state.rev,ns.rev)+1;
      state=ns;draft=blankDraft();saveDraft();
      saveLocal();
      render();toast('Backup caricato');
    }catch(e2){toast('Backup non valido');}
    return;
  }
  if(a==='undo'){
    if(arm!=='undo'){armFor('undo');return;}
    arm=null;
    if(undo()){draft=blankDraft();saveDraft();commit();toast('Annullato');}
    return;
  }
  if(a==='redo'){
    k='redo:'+el.dataset.s;
    if(arm!==k){armFor(k);return;}
    arm=null;redoStage(el.dataset.s);draft=blankDraft();saveDraft();commit();toast('Fase da rifare');return;
  }
  if(a==='reset'){
    if(arm!=='reset'){armFor('reset');return;}
    arm=null;
    var next=defaultState();next.rev=state.rev+1;next.gear=state.gear;next.seen=1;
    state=next;draft=blankDraft();saveDraft();viewStage=null;
    saveLocal();
    render();toast('Azzerato');
  }
});

render();
initStore();
})();
</script>
<script>if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
