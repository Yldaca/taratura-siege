<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1B24">
<meta name="description" content="Coach per trovare la sensibilità giusta in Rainbow Six Siege su PS5.">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
<title>Taratura Siege</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Una colonna su telefono con quattro schede in basso; da 1100px barra laterale e due colonne. Tutti i controlli a numeri vanno a capo invece di stringersi, così il numero non finisce mai sotto i pulsanti. */
:root{
  --bg:#E7ECEF;
  --surface:#F6F8F9;
  --ink:#0F1B24;
  --ink-2:#4B5B67;
  --line:#C3CDD3;
  --accent:#0A6B8E;
  --accent-ink:#FFFFFF;
  --accent-soft:#D2E6EE;
  --good:#1E7F4B;
  --warn:#8F5A00;
  --bad:#B23A2E;
  --band:rgba(30,127,75,.14);
  --sky:#D7DEE3;
  --floor:#BCC6CC;
  --font-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B141B;
    --surface:#121F29;
    --ink:#E4ECF0;
    --ink-2:#92A5B2;
    --line:#263845;
    --accent:#55C2E8;
    --accent-ink:#06222D;
    --accent-soft:#123342;
    --good:#4CC38A;
    --warn:#F0B341;
    --bad:#F0705F;
    --band:rgba(76,195,138,.16);
    --sky:#1B2C38;
    --floor:#24394A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B141B;
  --surface:#121F29;
  --ink:#E4ECF0;
  --ink-2:#92A5B2;
  --line:#263845;
  --accent:#55C2E8;
  --accent-ink:#06222D;
  --accent-soft:#123342;
  --good:#4CC38A;
  --warn:#F0B341;
  --bad:#F0705F;
  --band:rgba(76,195,138,.16);
  --sky:#1B2C38;
  --floor:#24394A;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 96px;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,ul,ol,figure{margin:0}
button,select,input,a.btn{font:inherit;color:inherit}
button,select,a.btn{cursor:pointer;touch-action:manipulation}
select,input{font-size:16px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:620px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.wrap>*{min-width:0}
main{display:flex;flex-direction:column;gap:16px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}

.top{display:flex;flex-direction:column;gap:8px}
.eyebrow{font:600 12px/1.2 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1{font:700 38px/.95 var(--font-display);text-transform:uppercase;letter-spacing:.01em}
.acct{display:flex;align-items:center;gap:8px;font:500 13px/1.3 var(--font-body);color:var(--ink-2);flex-wrap:wrap}
.acct i{width:9px;height:9px;border-radius:50%;background:var(--ink-2);flex:none}
.acct.ok i{background:var(--good)}
.acct.warn i{background:var(--warn)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font:700 24px/1 var(--font-display);text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
h3{font:600 16px/1.3 var(--font-body)}
.lbl{font:600 12px/1.3 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.lead{font-size:17px}
.note{color:var(--ink-2);font-size:14px}
.hint{font-size:13px;color:var(--ink-2)}
.warn-t{color:var(--warn);font-weight:500;font-size:14px}
.tag{font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:3px 5px;border-radius:2px;margin-left:6px;vertical-align:middle}

/* targa del valore da impostare */
.plate{padding:0;gap:0;clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,0 100%)}
.plate-h{background:var(--ink);color:var(--bg);display:flex;align-items:baseline;gap:12px;padding:12px 28px 12px 16px;flex-wrap:wrap}
.r-no{font:700 30px/1 var(--font-display);letter-spacing:.02em;text-transform:uppercase}
.r-meta{font:600 13px/1.3 var(--font-body);letter-spacing:.1em;text-transform:uppercase}
.plate-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.setting{display:flex;flex-direction:column;gap:2px}
.s-name{font:600 16px/1.2 var(--font-body)}
.s-val{font:600 60px/1.05 var(--font-mono);font-variant-numeric:tabular-nums;color:var(--accent);overflow-wrap:anywhere}
.s-val.txt{font-size:34px}
.s-was{font:500 13px var(--font-mono);color:var(--ink-2)}
.why{font-size:16px}

details>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:'+';font:600 18px var(--font-mono);color:var(--ink-2);flex:none}
details[open]>summary::after{content:'\2212'}
details.more>summary{font:600 13px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.others{border:1px solid var(--line);margin-top:4px}
.others .o{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.others .o:last-child{border-bottom:0}
.others .v{font:600 16px var(--font-mono)}

/* setup */
.setup>summary{font:600 13px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase}
.setup>summary span:first-child{min-width:0}
.setup>summary span.sm{font:500 12px var(--font-mono);letter-spacing:0;text-transform:none;color:var(--ink-2);margin-left:auto;text-align:right;white-space:nowrap}
.setup-b{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.sens-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:12px}
/* steppers: i pulsanti hanno larghezza fissa, il numero prende quello che resta e non scende mai sotto 56px */
.stp{display:flex;flex-wrap:nowrap;border:1px solid var(--line);align-items:stretch}
.stp button{flex:0 0 44px;min-height:48px;background:transparent;border:0;font:600 14px var(--font-mono);display:flex;align-items:center;justify-content:center}
.stp button.b1{flex-basis:46px;font-size:18px}
.stp .n{flex:1 1 56px;min-width:56px;display:flex;align-items:center;justify-content:center;font:600 22px/1 var(--font-mono);font-variant-numeric:tabular-nums;padding:4px 2px;border-inline:1px solid var(--line)}
.stp .n.big{font-size:30px;min-height:56px}
.stp .n.empty{color:var(--ink-2)}
.stp.wide button{flex-basis:56px;font-size:24px}
.fs{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);padding:12px}
.fs-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.fs-row .l{flex:1 1 92px;font-size:14px;color:var(--ink-2)}
.fs-row .opt-v{flex:2 1 172px;min-width:0;text-align:center;font:600 18px var(--font-mono);font-variant-numeric:tabular-nums;padding:10px 0;border:1px dashed var(--line)}
.fs-row select.sel,.fs-row .stp{flex:2 1 172px;width:auto;min-width:0}
select.sel{text-overflow:ellipsis;min-height:44px;padding:6px 10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:2px}
.txt-in{width:100%;min-height:48px;padding:8px 10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:2px;font:500 16px var(--font-body)}
.two-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.two-in label{display:flex;flex-direction:column;gap:4px;min-width:0}

.btn{min-height:48px;padding:0 16px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:600 14px/1.1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--line);color:var(--ink-2)}
.btn.block{width:100%}
.btn.big{min-height:56px;font-size:16px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
a.btn{text-decoration:none}
button:focus-visible,summary:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row-btn{display:flex;flex-wrap:wrap;gap:8px}
.row-btn>*{flex:1 1 150px}

.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line)}
.seg button{flex:1 1 56px;min-height:48px;padding:6px 8px;background:transparent;border:0;border-right:1px solid var(--line);font:500 15px/1.2 var(--font-body)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.seg.four button{flex-basis:70px;font-size:13px;padding:6px 4px}

/* allenamento a passi */
.steps-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:auto;min-width:40px;min-height:40px;padding:0 8px;border:1px solid var(--line);background:transparent;border-radius:2px;font:600 12px/1 var(--font-body);display:flex;align-items:center;justify-content:center;gap:4px}
.dots button[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dots button.ok{border-color:var(--good);color:var(--good)}
.dots button[aria-current="step"].ok{color:var(--bg)}
.dr-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;justify-content:space-between}
.dr-n{font:600 12px/1.2 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.with{display:flex;flex-wrap:wrap;gap:6px}
.with span{font:500 12px/1 var(--font-mono);background:var(--bg);border:1px solid var(--line);padding:6px 8px;border-radius:2px}
.how{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.how.num{font-size:15px}
.field{display:flex;flex-direction:column;gap:8px}
.res{font:600 15px var(--font-mono);color:var(--ink)}
.ask{font:600 17px/1.3 var(--font-body)}

/* animazioni */
.demo{display:flex;flex-direction:column;gap:8px}
.demo svg{display:block;width:100%;height:auto;border:1px solid var(--line);background:var(--sky)}
.demo-btns{display:flex;flex-wrap:wrap;gap:8px}
.demo-btns>*{flex:1 1 140px}
.dm-sky{fill:var(--sky)}
.dm-floor{fill:var(--floor)}
.dm-wall{fill:var(--floor)}
.dm-tgt{fill:var(--surface);opacity:.92}
.dm-ring{fill:none;stroke:var(--ink-2);stroke-width:1.5;opacity:.75}
.dm-edge{stroke:var(--ink-2);stroke-width:1.5;fill:none;opacity:.5}
.dm-body{fill:var(--ink-2)}
.dm-head{fill:var(--ink)}
.dm-gun{fill:var(--ink);opacity:.85}
.dm-flash{fill:var(--warn)}
.dm-cross{stroke:var(--accent);stroke-width:2.5;fill:none}
.dm-hit{fill:var(--good)}
.dm-miss{fill:var(--bad)}
.dm-hole{fill:var(--ink);opacity:.8}
.dm-t{font:600 12px var(--font-body);text-anchor:middle;fill:var(--ink)}
.dm-t.ok{fill:var(--good)}
.dm-t.bad{fill:var(--bad)}
.dm-cap{font:600 12px var(--font-body);fill:var(--ink-2)}

.tm{display:flex;flex-wrap:wrap;gap:10px;padding:12px;border:1px solid var(--line);background:var(--bg);align-items:center}
.t-time{font:600 44px/1 var(--font-mono);font-variant-numeric:tabular-nums;flex:1 1 120px}
.t-btns{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 200px}
.t-btns>*{flex:1 1 110px}
.t-state{font:500 13px/1.3 var(--font-body);color:var(--ink-2);flex:1 1 100%;min-height:17px}
.save-area{display:flex;flex-direction:column;gap:8px}

.final-vals{border:1px solid var(--line)}
.final-vals .o{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.final-vals .o:last-child{border-bottom:0}
.final-vals .v{font:600 20px/1 var(--font-mono)}

/* grafici */
.cs-row{display:flex;flex-wrap:wrap;gap:6px}
.cs{flex:1 1 72px;min-height:44px;background:transparent;border:1px solid var(--line);border-radius:2px;font:600 13px/1.2 var(--font-body);padding:4px 6px}
.cs[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chart svg{display:block;width:100%;height:auto}
.chart .band{fill:var(--band)}
.chart .zero{stroke:var(--ink-2);stroke-width:1}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .path{stroke:var(--ink-2);stroke-width:1.5;fill:none}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .pt.fin{fill:var(--good)}
.chart .mk{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}
.chart .mk.fin{stroke:var(--good);stroke-dasharray:none}
.chart text{font:500 11px var(--font-mono);fill:var(--ink-2)}
.chart text.v{fill:var(--ink);font-weight:600}
.chart .dot{fill:var(--ink-2);fill-opacity:.55;stroke:var(--surface);stroke-width:2}
.chart .dot.best{fill:var(--accent);fill-opacity:1}
.chart .line{stroke:var(--ink);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .line.thin{stroke:var(--ink-2);stroke-width:1.5}
.chart .lend{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.chart .ring{fill:none;stroke:var(--ink);stroke-width:1.5}
.chart .avgline{stroke:var(--ink-2);stroke-opacity:.5;stroke-width:1}
.chart .xh{stroke:var(--ink);stroke-width:1;stroke-opacity:.6}
.chart .hit,.chart .hit-all{fill:transparent;outline:none;stroke:none;cursor:crosshair}
.chart .hit:focus-visible,.chart .hit-all:focus-visible{stroke:var(--accent);stroke-width:2}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12px/1.3 var(--font-body);color:var(--ink-2)}
.lg-i{display:inline-flex;align-items:center;gap:6px}
.lg-d{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ink-2);opacity:.55}
.lg-d.best{background:var(--accent);opacity:1}
.lg-d.ring{background:transparent;border:2px solid var(--ink);opacity:1;width:12px;height:12px}
.lg-l{display:inline-block;width:16px;height:2px;background:var(--ink)}
.ro{font:500 13px/1.4 var(--font-mono);color:var(--ink);min-height:38px;padding:8px 10px;background:var(--bg);border:1px solid var(--line);overflow-wrap:anywhere}
.hb{display:flex;flex-direction:column;gap:12px}
.hb-r{display:flex;flex-direction:column;gap:4px}
.hb-l{display:flex;justify-content:space-between;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.hb-l .nm{font:600 14px var(--font-mono)}
.hb-l .nn{font:500 12px var(--font-body);color:var(--ink-2)}
.hb-b{display:flex;align-items:center;gap:8px}
.hb-t{flex:1 1 auto;height:16px;background:var(--bg);min-width:0}
.hb-f{height:100%;background:var(--ink-2);opacity:.55;border-radius:0 4px 4px 0}
.hb-r.best .hb-f{background:var(--accent);opacity:1}
.hb-r.thin .hb-f{opacity:.3}
.hb-v{flex:0 0 auto;min-width:40px;font:600 14px var(--font-mono);text-align:right}

/* consigli */
.adv{display:flex;flex-direction:column;gap:14px}
.adv-1{border:1px solid var(--accent);background:var(--accent-soft);padding:14px;display:flex;flex-direction:column;gap:6px}
.adv-1 .k{font:600 12px/1.2 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.adv-1 .t{font:700 22px/1.15 var(--font-display);text-transform:uppercase;letter-spacing:.02em}
.adv-i{display:flex;flex-direction:column;gap:2px;padding-left:12px;border-left:3px solid var(--line)}
.adv-i h3{font-size:15px}
.gate{display:flex;flex-direction:column;gap:8px}
.bar{height:12px;background:var(--bg);border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}

.stg{display:flex;flex-direction:column;gap:10px}
.stg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.st-chip{font:600 11px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;border:1px solid var(--line);color:var(--ink-2);border-radius:2px}
.st-chip.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st-chip.cur{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.st-chip.up{background:var(--good);border-color:var(--good);color:var(--bg)}
.st-chip.dn{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.stg-v{font:600 22px/1.1 var(--font-mono)}
.tw{overflow-x:auto;border:1px solid var(--line)}
.tw table{border-collapse:collapse;width:100%;min-width:300px;font-size:13px}
.tw th,.tw td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tw th{font:600 11px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.tw tr:last-child td{border-bottom:0}
.tw td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cal-head h2{text-transform:capitalize}
.cal-nav{display:flex;gap:6px}
.cal-nav button{min-width:48px;min-height:44px;background:transparent;border:1px solid var(--line);border-radius:2px;font:600 16px var(--font-mono)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-w{font:600 11px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-align:center;padding-block:4px}
.cal-d{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;background:transparent;border:1px solid var(--line);border-radius:2px}
.cal-d .dn{font:500 14px/1 var(--font-body)}
.cal-d .ds{font:600 12px/1 var(--font-mono);color:var(--ink-2)}
.cal-d.has{background:var(--accent-soft)}
.cal-d.has .ds{color:var(--ink)}
.cal-d.today{border-color:var(--ink);border-width:2px}
.cal-d.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cal-d.sel .ds{color:var(--bg)}
.cal-e{min-height:52px}
.rd{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);background:var(--bg)}
.rd-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.rd-h b{font:600 15px var(--font-body)}
.rd-h span{font:500 13px var(--font-mono);color:var(--ink-2)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 12px;font-size:13px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv .k{font:600 10px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.kv .x{font:500 13px/1.35 var(--font-mono);overflow-wrap:anywhere}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px}
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font:600 10px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.kpi .n{font:600 20px/1.1 var(--font-mono);font-variant-numeric:tabular-nums}

<script>
(function(){
'use strict';

/* ---------- dati fissi ---------- */
var BASE={h:75,v:50,ads1:11,ads25:11,cap:'concava'};
var TOL=1,MAXR=4,MIN_T=5,MIN_ADV=4;
var WT={hit:0.4,trk:0.2,swi:0.2,pre:0.2,rec:0.2};
/* Ogni round pesa solo gli esercizi che contiene: i round vecchi col pre-aim e senza rinculo restano confrontabili. */
function comps(r){
  var o=[['hit',WT.hit,(20-r.a-r.b)/20]];
  o.push(['trk',WT.trk,(r.trk-1)/4]);
  if(r.swi!==null&&r.swi!==undefined)o.push(['swi',WT.swi,r.swi/10]);
  else if(r.pre!==null&&r.pre!==undefined)o.push(['pre',WT.pre,(r.pre-1)/4]);
  if(r.rec!==null&&r.rec!==undefined)o.push(['rec',WT.rec,r.rec/(r.recN||10)]);
  return o;
}
function cnt(n,s,p){return n+' '+(n===1?s:p);}
var SAY_H=function(a,b){return 'Hai superato la testa '+cnt(a,'volta','volte')+' e sei rimasto corto '+cnt(b,'volta','volte')+'.';};
var SAY_V=function(a,b){return 'Sei finito sopra la testa '+cnt(a,'volta','volte')+' e sotto la testa '+cnt(b,'volta','volte')+'.';};
var STAGES=[
  {id:'h',name:'Sensibilità orizzontale',tab:'Orizzontale',kind:'num',mode:'hip',optic:null,init:75,
   la:'Superate',lb:'Corte',sa:'Sup.',sb:'Cor.',ha:'Il mirino va oltre la testa.',hb:'Il mirino si ferma prima della testa.',
   up:'hai superato la testa',down:'sei rimasto corto',say:SAY_H,
   intro:'Primo round: parti dai valori che hai adesso.'},
  {id:'v',name:'Sensibilità verticale',tab:'Verticale',kind:'num',mode:'hip',optic:null,init:50,
   la:'Troppo in alto',lb:'Troppo in basso',sa:'Alto',sb:'Basso',ha:'Il mirino finisce sopra la testa.',hb:'Il mirino finisce sotto la testa.',
   up:'sei finito sopra la testa',down:'sei finito sotto la testa',say:SAY_V,
   intro:'Ora la verticale. Cambia solo questo numero.'},
  {id:'ads1',name:'Mirino 1.0x',tab:'Mirino 1.0x',kind:'num',mode:'ads',optic:'1.0x',init:11,
   la:'Superate',lb:'Corte',sa:'Sup.',sb:'Cor.',ha:'Il mirino va oltre la testa.',hb:'Il mirino si ferma prima della testa.',
   up:'hai superato la testa',down:'sei rimasto corto',say:SAY_H,
   intro:'Ora il mirino 1.0x. Cambia solo questo numero.'},
  {id:'ads25',name:'Mirino 2.5x',tab:'Mirino 2.5x',kind:'num',mode:'ads',optic:'2.5x',init:null,
   la:'Superate',lb:'Corte',sa:'Sup.',sb:'Cor.',ha:'Il mirino va oltre la testa.',hb:'Il mirino si ferma prima della testa.',
   up:'hai superato la testa',down:'sei rimasto corto',say:SAY_H,
   intro:'Ora il mirino 2.5x. Parte poco sotto l\'1.0x.'},
  {id:'cap',name:'Cappetta stick destro',tab:'Cappetta',kind:'cap',mode:'ads',optic:null,init:null,
   la:'Superate',lb:'Corte',sa:'Sup.',sb:'Cor.',ha:'Il mirino va oltre la testa.',hb:'Il mirino si ferma prima della testa.',
   up:'',down:'',say:SAY_H,
   intro:'Ultima fase: monta la cappetta Convesso alto. I numeri restano quelli trovati.'}
];
var STAGE_IDS=STAGES.map(function(s){return s.id;});
var SENS_KEYS=['h','v','ads1','ads25'];
var NS=STAGES.length;
var CAPS=[{id:'standard',name:'Normale'},{id:'concava',name:'Concavo alto'},{id:'bassa',name:'Convesso basso'},{id:'convessa',name:'Convesso alto'}];
var CURVES=[{id:'lineare',name:'Lineare'},{id:'veloce',name:'Veloce'},{id:'precisa',name:'Precisa'},{id:'stabile',name:'Stabile'},{id:'digitale',name:'Digitale'},{id:'dinamica',name:'Dinamica'}];
var GEAR0={rcap:'concava',rc:'precisa',rm:2,rd:5,lcap:'standard',lc:'lineare',lm:0,ld:5};
/* Tutte le grandezze delle ottiche del gioco. L'1.0x e il 2.5x li trova il percorso; gli altri si calcolano da quei due e puoi correggerli a mano. */
var OPT_Z=[1,2.5,3.5,8];
function optKey(z){return z.toFixed(1);}
function optLbl(z){return (z===Math.round(z)?z+'.0':String(z))+'x';}
var OPT_KEYS=OPT_Z.map(optKey);
var OPT_MAIN={'1.0':'ads1','2.5':'ads25'};
function optFit(a1,a25){
  var b=(a1-a25)/0.6,a=a1-b;
  return function(z){return clampV(Math.round(a+b/z));};
}
function opticVals(vals){
  var f=optFit(vals.ads1,vals.ads25),o={};
  OPT_Z.forEach(function(z){
    var k=optKey(z);
    o[k]=OPT_MAIN[k]?vals[OPT_MAIN[k]]:(state.optx[k]!==undefined?state.optx[k]:f(z));
  });
  return o;
}
var OPS=['Ash','Thermite','Sledge','Thatcher','Twitch','Zofia','Ace','Iana','Buck','Hibana','Jackal','Nomad','Finka','Lion','Maverick','Kali','Amaru','Gridlock','Blitz','Montagne','Fuze','Glaz','Capitão','Dokkaebi','Ying','Nøkk','Osa','Flores','Zero','Sens','Grim','Brava','Ram','Jäger','Bandit','Mute','Smoke','Rook','Doc','Castle','Pulse','Valkyrie','Caveira','Echo','Mira','Lesion','Ela','Vigil','Maestro','Alibi','Clash','Kaid','Mozzie','Warden','Goyo','Wamai','Oryx','Melusi','Aruni','Thunderbird','Thorn','Azami','Solis','Fenrir','Tubarão'];
var WEPS=['R4-C','ARX200','AK-12','552 Commando','Type-89','C8-SFW','F2','AR33','M4','416-C Carbine','Spear .308','Commando 9','M762','AUG A2','G36C','L85A2','Para-308','C7E','F90','M870','SG-CQB','Vector .45 ACP','MP5','MP7','UMP45','P90','SMG-11','MP5K','9x19VSN','MPX','Scorpion EVO 3 A1','T-5 SMG','M249','LMG-E','6P41','G8A1','AUG A3','K1A','Bearing 9','FMG-9'];
function nameOf(list,id){for(var i=0;i<list.length;i++){if(list[i].id===id)return list[i].name;}return String(id);}
function capName(id){return nameOf(CAPS,id);}
function stageById(id){return STAGES[STAGE_IDS.indexOf(id)];}
function fv(id,v){return id==='cap'?capName(v):String(v);}

/* I quattro allenamenti. "with" mostra i numeri che stai usando in quel momento, "how" li ripete nelle istruzioni. */
function adsLine(u,def){
  var o=(def&&def.mode==='ads')?(def.optic||'1.0x'):'1.0x';
  return 'mirino '+o+' a '+(o==='2.5x'?u.ads25:u.ads1);
}
var DRILLS=[
  {id:'trk',name:'Tracking',short:'Trk',mins:4,ask:'Quanto sei rimasto sulla testa?',
   kind:'rate',hintLo:'1 = quasi sempre fuori',hintHi:'5 = quasi sempre sopra',
   chips:function(u){return ['orizzontale '+u.h,'verticale '+u.v,'senza L2'];},
   how:function(u){return ['Poligono di tiro, bersaglio che si sposta di lato.','Senza L2, tieni il mirino sulla testa mentre cammina.','30 secondi sì e 5 di pausa, fino alla fine del tempo.'];},
   q:'rainbow six siege tracking aim training controller'},
  {id:'flk',name:'Flick',short:'Flick',mins:5,ask:null,
   kind:'ab',
   chips:function(u,def){return def?(def.mode==='ads'?[adsLine(u,def),'L2 sempre premuto']:['orizzontale '+u.h,'verticale '+u.v,'mai L2']):['orizzontale '+u.h,'verticale '+u.v];},
   how:function(u,def){
     var m=(def&&def.mode==='ads')
       ?('Tieni L2 premuto dall\'inizio alla fine, con il '+adsLine(u,def)+': giri già mirando, non premi L2 dopo aver girato.')
       :'Niente L2, mai: giri la visuale e spari dall\'anca. Serve a tarare la sensibilità senza mirino.';
     return [m,'Parti col mirino lontano dal bersaglio, giri di colpo e ti fermi sulla testa.','Un colpo solo, torni al centro e rifai. In tutto 20 colpi.'];},
   q:'rainbow six siege flick aim training controller'},
  {id:'swi',name:'Transizioni',short:'Trans',mins:3,ask:'Quanti passaggi netti su 10?',
   kind:'n10',hint:'Netto = arrivi sulla testa e spari senza correggere.',
   chips:function(u,def){return [adsLine(u,def),'due bersagli','L2 premuto'];},
   how:function(u,def){return ['Due bersagli a media distanza, distanti fra loro, con L2 premuto.','Testa del primo, spari, passi di colpo alla testa del secondo e spari.','Conta i passaggi in cui sei finito sulla testa senza aggiustare. Fai 10 passaggi.'];},
   q:'rainbow six siege target switching aim training'},
  {id:'rec',name:'Rinculo',short:'Rinc',mins:3,ask:'Colpi dentro il bersaglio',
   kind:'mag',
   chips:function(u,def){return [adsLine(u,def),'bersaglio a cerchi','caricatore intero'];},
   how:function(u){return ['Poligono di tiro, bersaglio a cerchi a media distanza. Con L2, mirino sul centro.','Svuota tutto il caricatore senza mollare il grilletto, accompagnando lo stick giù.','Guarda i fori: quanti sono dentro il bersaglio, dove è arrivato il più alto e da che parte tira il gruppo.'];},
   q:'rainbow six siege recoil control console tips'}
];
var DRILL_IDS=DRILLS.map(function(d){return d.id;});
var RING=['Centro','1° anello','2° anello','3° anello','Fuori'];
var DRIFT=[[-1,'A sinistra'],[0,'Dritto'],[1,'A destra']];
function driftName(d){return d===null||d===undefined?null:DRIFT[d+1][1];}
var ND=DRILLS.length;

/* ---------- date ---------- */
var MONTHS=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
function pad(n){return String(n).padStart(2,'0');}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseKey(k){var p=String(k).split('-');return new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));}
function weekStart(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;}
function fmtD(d){try{return d.toLocaleDateString('it-IT',{day:'numeric',month:'short'});}catch(e){return dkey(d);}}
function fmtT(ts){try{return new Date(ts).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function parseAt(at){
  var m=/(\d{1,2})\s+([a-zà-ù]{3})/i.exec(String(at||''));
  if(!m)return null;
  var mi=MONTHS.indexOf(m[2].toLowerCase());
  if(mi<0)return null;
  var now=new Date(),y=now.getFullYear(),d=new Date(y,mi,Number(m[1]));
  if(d.getTime()>now.getTime()+86400000)d=new Date(y-1,mi,Number(m[1]));
  return dkey(d);
}

/* ---------- stato ---------- */
var LS='taratura-siege-v2',LSD='taratura-siege-v2-draft';
function clampInt(n,lo,hi){n=Math.round(Number(n));if(!isFinite(n))n=lo;return Math.max(lo,Math.min(hi,n));}
function clampV(x){return Math.max(1,Math.min(100,x));}
function txt(s,max){s=String(s===undefined||s===null?'':s).replace(/[\u0000-\u001f]/g,' ').trim();return s.slice(0,max||28);}
function normGear(g){
  var o=Object.assign({},GEAR0);
  if(g&&typeof g==='object'){
    ['rcap','lcap'].forEach(function(k){if(CAPS.some(function(c){return c.id===g[k];}))o[k]=g[k];});
    ['rc','lc'].forEach(function(k){if(CURVES.some(function(c){return c.id===g[k];}))o[k]=g[k];});
    ['rm','lm'].forEach(function(k){if(g[k]!==undefined)o[k]=clampInt(g[k],-10,10);});
    ['rd','ld'].forEach(function(k){if(g[k]!==undefined)o[k]=clampInt(g[k],0,30);});
  }
  return o;
}
function normSetup(s){
  if(!s||typeof s!=='object')return null;
  var o=normGear(s);
  SENS_KEYS.forEach(function(k){if(s[k]!==undefined)o[k]=clampInt(s[k],1,100);});
  if(s.optx&&typeof s.optx==='object'){
    o.optx={};
    OPT_KEYS.forEach(function(k){if(s.optx[k]!==undefined)o.optx[k]=clampInt(s.optx[k],1,100);});
  }
  return o;
}
function defaultState(){return {v:3,rev:0,rounds:[],locks:{},manual:{},gear:normGear(null),carry:{},kit:{op:'',wep:'',mag:30},optx:{},seen:0};}
function normalize(r){
  var s=defaultState();
  try{
    var o=JSON.parse(JSON.stringify(r||{}));
    s.rev=Number(o.rev)||0;
    s.seen=Number(o.seen)||0;
    if(Array.isArray(o.rounds)){
      o.rounds.forEach(function(x){
        if(!x||typeof x!=='object')return;
        var st=x.stage;
        if(STAGE_IDS.indexOf(st)<0&&st!=='free')return;
        var a=clampInt(x.a,0,20),b=clampInt(x.b,0,20-a);
        var val=(st==='cap')?(CAPS.some(function(c){return c.id===x.value;})?x.value:'convessa'):(st==='free'?null:clampInt(x.value,1,100));
        s.rounds.push({stage:st,value:val,a:a,b:b,trk:clampInt(x.trk,1,5),pre:clampInt(x.pre,1,5),
          swi:(x.swi===null||x.swi===undefined)?null:clampInt(x.swi,0,10),
          ring:(x.ring===null||x.ring===undefined)?null:clampInt(x.ring,0,4),
          drift:(x.drift===null||x.drift===undefined)?null:clampInt(x.drift,-1,1),
          recN:clampInt(x.recN===undefined?10:x.recN,1,120),
          rec:(x.rec===null||x.rec===undefined)?null:clampInt(x.rec,0,clampInt(x.recN===undefined?10:x.recN,1,120)),
          op:txt(x.op),wep:txt(x.wep),at:String(x.at||''),
          day:/^\d{4}-\d{2}-\d{2}$/.test(String(x.day||''))?x.day:parseAt(x.at),ts:Number(x.ts)||0,
          setup:normSetup(x.setup),focus:(SENS_KEYS.indexOf(x.focus)>-1?x.focus:null)});
      });
    }
    if(o.locks&&typeof o.locks==='object'){
      Object.keys(o.locks).forEach(function(k){if(STAGE_IDS.indexOf(k)>-1&&k!=='cap')s.locks[k]=clampInt(o.locks[k],1,100);});
    }
    if(o.manual&&CAPS.some(function(c){return c.id===o.manual.cap;}))s.manual.cap=o.manual.cap;
    s.gear=normGear(o.gear);
    if(o.carry&&typeof o.carry==='object'){
      SENS_KEYS.forEach(function(k){if(o.carry[k]!==undefined)s.carry[k]=clampInt(o.carry[k],1,100);});
    }
    if(o.kit&&typeof o.kit==='object'){s.kit={op:txt(o.kit.op),wep:txt(o.kit.wep),mag:clampInt(o.kit.mag===undefined?30:o.kit.mag,1,120)};}
    if(o.optx&&typeof o.optx==='object'){
      OPT_KEYS.forEach(function(k){if(!OPT_MAIN[k]&&o.optx[k]!==undefined)s.optx[k]=clampInt(o.optx[k],1,100);});
    }
  }catch(e){}
  return s;
}
var saveT=null;

  if(!me)return;
  clearTimeout(saveT);

/* ---------- motore ---------- */
/* Il flick misura l'equilibrio: a = superate, b = corte. Quando a e b sono quasi pari il valore è giusto. */
function rScore(r){
  var c=comps(r),w=0,v=0;
  c.forEach(function(x){w+=x[1];v+=x[1]*Math.max(0,Math.min(1,x[2]));});
  return w?100*v/w:0;
}
function deco(r,i){
  return {n:i+1,stage:r.stage,value:r.value,a:r.a,b:r.b,trk:r.trk,pre:r.pre,swi:r.swi,rec:r.rec,recN:r.recN,ring:r.ring,drift:r.drift,op:r.op,wep:r.wep,
    at:r.at,day:r.day,ts:r.ts,setup:r.setup,focus:r.focus,
    d:r.a-r.b,hits:20-r.a-r.b,bal:Math.abs(r.a-r.b)<=TOL,score:rScore(r)};
}
function pickBest(rounds){
  var g={},best=null;
  rounds.forEach(function(r){var k=String(r.value);if(!g[k])g[k]={v:r.value,ds:[],sc:[]};g[k].ds.push(Math.abs(r.d));g[k].sc.push(r.score);});
  Object.keys(g).forEach(function(k){
    var e=g[k];e.md=mean(e.ds);e.ms=mean(e.sc);
    if(!best||e.md<best.md||(e.md===best.md&&e.ms>best.ms))best=e;
  });
  return best?best.v:null;
}
function stepFor(value,d){
  var pct=Math.max(0.04,Math.min(0.2,0.03*Math.abs(d)));
  return Math.max(1,Math.round(value*pct));

function solveNum(start,rounds,lock){
  var res={done:false,final:null,next:start,reason:'start',lo:null,hi:null};
  if(lock!==undefined&&lock!==null){res.done=true;res.final=Number(lock);res.reason='lock';return res;}
  var n=rounds.length;
  if(n===0)return res;
  var last=rounds[n-1],prev=rounds[n-2];
  var highs=rounds.filter(function(r){return r.d>TOL;}).map(function(r){return r.value;});
  var lows=rounds.filter(function(r){return r.d<-TOL;}).map(function(r){return r.value;});
  var minHigh=highs.length?Math.min.apply(null,highs):null;
  var maxLow=lows.length?Math.max.apply(null,lows):null;
  var bracket=(minHigh!==null&&maxLow!==null&&maxLow<minHigh);
  res.lo=bracket?maxLow:null;res.hi=bracket?minHigh:null;
  if(n>=2&&last.bal&&prev.bal&&last.value===prev.value){res.done=true;res.final=last.value;res.reason='confirmed';return res;}
  if(bracket&&minHigh-maxLow<=1){
    res.done=true;
    res.final=pickBest(rounds.filter(function(r){return r.value===minHigh||r.value===maxLow;}));
    res.reason='bracket';return res;
  }
  if(n>=MAXR){res.done=true;res.final=pickBest(rounds);res.reason='max';return res;}
  if(last.bal){res.next=last.value;res.reason='confirm';return res;}
  if(bracket){res.next=Math.round((maxLow+minHigh)/2);res.reason='mid';return res;}
  var st=stepFor(last.value,last.d);
  res.next=clampV(last.value+(last.d>0?-st:st));
  res.reason='step';
  return res;
}
function solveCap(rounds,ref,T,manual){
  var res={done:false,final:null,next:'convessa',reason:'start',delta:null,score:null,tested:rounds.length?rounds[rounds.length-1].value:'convessa'};
  if(rounds.length)res.score=mean(rounds.map(function(r){return r.score;}));
  if(rounds.length===1)res.reason='again';
  if(rounds.length>=2){
    res.done=true;
    if(ref===null){res.final='concava';res.reason='noref';}
    else{
      res.delta=res.score-ref;
      if(res.delta>=T){res.final=res.tested;res.reason='up';}
      else if(res.delta<=-T){res.final='concava';res.reason='down';}
      else{res.final='concava';res.reason='pari';}
    }
    if(manual){res.final=manual;res.reason='manual';}
  }
  return res;
}
function computePlan(){
  var vals=Object.assign({},BASE),noise=[],stages=[],cur=-1,prevDone=true;
  var all=state.rounds.map(deco);
  STAGES.forEach(function(def,i){
    var rounds=all.filter(function(r){return r.stage===def.id;});
    var st={def:def,rounds:rounds,status:'todo',done:false,final:null,next:null,reason:null,lo:null,hi:null,start:null,ref:null,delta:null,T:null,score:null,tested:null};
    var res;
    if(def.kind==='cap'){
      var prev=stages[i-1],pool=[];
      if(prev){
        pool=prev.rounds.filter(function(r){return prev.final!==null&&r.value===prev.final;});
        if(!pool.length&&prev.rounds.length)pool=prev.rounds.slice(-2);
      }
      var ref=pool.length?mean(pool.map(function(r){return r.score;})):null;
      var nz=noise.slice();
      if(rounds.length>=2)nz.push(Math.abs(rounds[0].score-rounds[1].score));
      var T=Math.max(MIN_T,nz.length?mean(nz):0);
      res=solveCap(rounds,ref,T,state.manual.cap||null);
      st.ref=ref;st.T=T;st.delta=res.delta;st.score=res.score;st.tested=res.tested;
    }else{
      st.start=(def.id==='ads25')?clampV(vals.ads1-2):def.init;
      res=solveNum(st.start,rounds,state.locks[def.id]);
      st.lo=res.lo;st.hi=res.hi;
      if(res.done&&res.reason==='confirmed'){
        var m=rounds.length;noise.push(Math.abs(rounds[m-1].score-rounds[m-2].score));
      }
    }
    st.done=res.done;st.final=res.final;st.next=res.next;st.reason=res.reason;
    if(!prevDone)st.status='todo';
    else if(res.done)st.status='done';
    else{st.status='active';if(cur<0)cur=i;}
    if(st.status==='done')vals[def.id]=st.final;
    else if(st.status==='active')vals[def.id]=st.next;
    prevDone=prevDone&&res.done;
    stages.push(st);

  if(finished){SENS_KEYS.forEach(function(k){if(state.carry[k]!==undefined)vals[k]=state.carry[k];});}
  return {stages:stages,cur:(finished?NS:cur),vals:vals,finished:finished,T:Math.max(MIN_T,noise.length?mean(noise):0)};

function explain(st){

    if(!st.done)return null;
    var ds=(st.delta===null)?'':nf(Math.abs(st.delta),1),tn=capName(st.tested);
    if(st.reason==='up')return 'Con '+tn+' il punteggio sale di '+ds+' punti. La tieni.';
    if(st.reason==='down')return 'Con '+tn+' il punteggio scende di '+ds+' punti. Torni a '+capName('concava')+'.';
    if(st.reason==='pari')return 'Differenza di soli '+ds+' punti: resti su '+capName('concava')+'.';
    if(st.reason==='noref')return 'Senza un riferimento resti su '+capName('concava')+'.';
    return 'Scelta tua: '+capName(st.final)+'.';
  }
  if(!n)return null;
  var last=rs[n-1],say=def.say(last.a,last.b);
  switch(st.reason){
    case 'step':return say+' '+(last.d>0?'Troppo alta.':'Troppo bassa.')+' Prova '+st.next+'.';
    case 'mid':return 'Hai provato '+st.hi+' (troppo alta) e '+st.lo+' (troppo bassa). Prova la via di mezzo.';
    case 'confirm':return say+' Ci sei quasi: ripeti lo stesso numero per conferma.';
    case 'confirmed':return 'Confermato: '+st.final+' resta in equilibrio due round di fila.';
    case 'bracket':return 'Sopra e sotto sono già provati. Tieni '+st.final+'.';
    case 'max':return 'Dopo '+MAXR+' round tieni '+st.final+', il più equilibrato.';
    case 'lock':return 'Hai chiuso la fase con '+st.final+'.';
  }
  return null;
}
var REASON_SHORT={confirmed:'confermato in due round',bracket:'tra un valore alto e uno basso',max:'dopo '+MAXR+' round',lock:'chiusa da te',up:'cappetta nuova migliore',down:'quella di prima migliore',pari:'differenza sotto la soglia',noref:'senza riferimento',manual:'scelta tua'};

/* ---------- settimana ---------- */
function weeklyReviews(){
  var rs=state.rounds.map(deco).filter(function(r){return r.day;});
  var byW={};
  rs.forEach(function(r){
    var ws=weekStart(parseKey(r.day)),k=dkey(ws);
    if(!byW[k])byW[k]={start:ws,rounds:[]};
    byW[k].rounds.push(r);
  });
  var keys=Object.keys(byW).sort(),out=[];
  keys.forEach(function(k,i){
    var w=byW[k],R=w.rounds,days={};
    R.forEach(function(r){days[r.day]=1;});
    var sc=R.map(function(r){return r.score;});
    var o={key:k,start:w.start,end:addDays(w.start,6),n:R.length,days:Object.keys(days).length,
      score:mean(sc),delta:null,verdict:'Prima settimana',vcls:''};
    var prev=out[i-1];
    if(prev){
      o.delta=o.score-prev.score;
      if(o.delta>=5){o.verdict='In crescita';o.vcls='up';}
      else if(o.delta<=-5){o.verdict='In calo';o.vcls='dn';}
      else o.verdict='Stabile';
    }
    out.push(o);
  });
  return out.reverse();
}

}
async function wake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');}}catch(e){}}
function release(){try{if(wl)wl.release();}catch(e){}wl=null;}
function anyRunning(){return T.some(function(t){return t.running;});}
function stopIfIdle(){if(!anyRunning()){clearInterval(tick);tick=null;release();}}
function tStart(i){
  T.forEach(function(t,j){if(j!==i&&t.running){t.left=Math.max(0,t.endAt-Date.now());t.running=false;}});
  var t=T[i];
  if(t.left<=0)t.left=t.full;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(AC&&!ac)ac=new AC();
    if(ac&&ac.resume)ac.resume();
  }catch(e){}
  t.running=true;t.endAt=Date.now()+t.left;
  if(!tick)tick=setInterval(tTick,250);
  wake();tRender();
}
function tPause(i){var t=T[i];t.left=Math.max(0,t.endAt-Date.now());t.running=false;stopIfIdle();tRender();}
function tReset(i){var t=T[i];t.running=false;t.left=t.full;stopIfIdle();tRender();}
function tResetAll(){T.forEach(function(t){t.running=false;t.left=t.full;});stopIfIdle();}
function tTick(){
  var fin=false;
  T.forEach(function(t){
    if(!t.running)return;
    var l=t.endAt-Date.now();
    if(l<=0){t.running=false;t.left=0;fin=true;}else t.left=l;
  });
  if(fin){beep();stopIfIdle();}
  tRender();
}
function tRender(){
  var tm=$('t-time'),go=$('t-go'),stt=$('t-state');
  if(!tm)return;
  var t=T[dstep];
  tm.textContent=fmt(t.left);
  go.textContent=t.running?'Pausa':(t.left<=0?'Ricomincia':(t.left<t.full?'Riprendi':'Avvia'));

}

/* ---------- analisi ---------- */
/* Incrocio i round del periodo scelto: punteggio, sensibilità usate, operatore e arma. Una differenza conta solo se supera la soglia di rumore e se i due gruppi hanno almeno 2 round. */
var anP='all',anFrom='',anTo='',anTrend=null,anTrendI=0;
function cmpDay(a,b){return a.day<b.day?-1:(a.day>b.day?1:a.n-b.n);}
function comboKey(s){return SENS_KEYS.map(function(k){return s[k];}).join('/');}
function comboLabel(s){return s.h+'/'+s.v+' · '+s.ads1+'/'+s.ads25;}
function kitLabel(r){
  var o=txt(r.op),w=txt(r.wep);
  if(!o&&!w)return null;
  return (o||'Operatore?')+' · '+(w||'Arma?');
}
function dm(day){var d=parseKey(day);return d.getDate()+'/'+(d.getMonth()+1);}
function anRange(){
  var now=new Date(),from='0000-00-00',to='9999-99-99';
  if(anP==='7'){from=dkey(addDays(now,-6));to=dkey(now);}
  else if(anP==='30'){from=dkey(addDays(now,-29));to=dkey(now);}
  else if(anP==='custom'){
    if(anFrom)from=anFrom;
    if(anTo)to=anTo;
    if(from>to){var x=from;from=to;to=x;}
  }
  return {from:from,to:to};
}
function grpStat(rs){
  return {n:rs.length,days:uniq(rs.map(function(r){return r.day;})).length,score:mean(rs.map(function(r){return r.score;})),
    hits:mean(rs.map(function(r){return r.hits;})),trk:mean(rs.map(function(r){return r.trk;})),pre:mean(rs.map(function(r){return r.pre;})),rs:rs};
}
function separated(a,b){
  if(!a.length||!b.length)return 0;
  var ai=a.map(function(r){return r.i;}),bi=b.map(function(r){return r.i;});
  if(Math.min.apply(null,ai)>Math.max.apply(null,bi))return 1;
  if(Math.min.apply(null,bi)>Math.max.apply(null,ai))return -1;
  return 0;
}
function groupBy(rs,fn){
  var g={},ord=[];
  rs.forEach(function(r){var k=fn(r);if(k===null||k===undefined)return;if(!g[k]){g[k]=[];ord.push(k);}g[k].push(r);});
  return ord.map(function(k){var st=grpStat(g[k]);st.key=k;return st;});
}
function analyze(P){
  var rg=anRange();
  var rs=state.rounds.map(deco).filter(function(r){return r.day&&r.day>=rg.from&&r.day<=rg.to;}).sort(cmpDay);
  rs.forEach(function(r,i){r.i=i;});
  var A={rg:rg,rs:rs,n:rs.length,T:P.T,days:[],combos:[],params:{},losses:[],ins:[],best:null,noSetup:0,trend:null,avg:null,ss:[],caps:[],kits:[],bestKit:null};
  if(!rs.length)return A;
  var T=P.T;
  A.avg=mean(rs.map(function(r){return r.score;}));
  var byD={},ordD=[];
  rs.forEach(function(r){if(!byD[r.day]){byD[r.day]=[];ordD.push(r.day);}byD[r.day].push(r);});
  A.days=ordD.map(function(d){
    var L=byD[d];
    return {day:d,rs:L,n:L.length,avg:mean(L.map(function(r){return r.score;})),combos:uniq(L.filter(function(r){return r.setup;}).map(function(r){return comboLabel(r.setup);}))};
  });
  if(rs.length>=6){
    var h=Math.floor(rs.length/2);
    A.trend=mean(rs.slice(rs.length-h).map(function(r){return r.score;}))-mean(rs.slice(0,h).map(function(r){return r.score;}));
  }
  var ss=rs.filter(function(r){return r.setup;});
  A.ss=ss;A.noSetup=rs.length-ss.length;

  A.combos=groupBy(ss,function(r){return comboKey(r.setup);}).map(function(c){c.label=comboLabel(c.rs[0].setup);return c;})
    .sort(function(a,b){return (b.score-a.score)||(b.n-a.n);});
  if(A.combos.length>=2){
    var el=A.combos.filter(function(c){return c.n>=2;});
    var b=el.length?el[0]:A.combos[0];
    var rest=ss.filter(function(r){return comboKey(r.setup)!==b.key;});
    var ra=mean(rest.map(function(r){return r.score;}));
    A.best={c:b,weak:!el.length,restAvg:ra,diff:b.score-ra,late:separated(b.rs,rest)};
  }

  SENS_KEYS.forEach(function(k){
    var items=groupBy(ss,function(r){return r.setup[k];}).map(function(it){
      it.v=Number(it.key);
      var fr=it.rs.filter(function(r){return r.focus===k;});
      it.fn=fr.length;it.md=fr.length?mean(fr.map(function(r){return r.d;})):null;
      return it;
    }).sort(function(a,b){return a.v-b.v;});
    var q={k:k,items:items,best:null,cur:null,gap:null,level:'none',late:0,weak:false,curNow:false};
    if(items.length){
      var e2=items.filter(function(x){return x.n>=2;}),pool=e2.length?e2:items;
      q.best=pool.reduce(function(m,x){return x.score>m.score?x:m;},pool[0]);
      q.weak=!e2.length;
      var cv=P.vals[k];
      q.cur=items.filter(function(x){return x.v===cv;})[0]||items.reduce(function(m,x){return x.n>m.n?x:m;},items[0]);
      q.curNow=(q.cur.v===cv);
      if(items.length<2)q.level='one';
      else{
        q.gap=q.best.score-q.cur.score;
        if(q.best===q.cur||q.gap<=0)q.level='same';
        else{
          q.level=(q.gap>=T&&q.best.n>=2&&q.cur.n>=2)?'real':'noise';
          q.late=separated(q.best.rs,q.cur.rs);
        }
      }
    }
    A.params[k]=q;
  });

  var CN={hit:'Colpite nel flick',trk:'Tracking',swi:'Transizioni',pre:'Pre-aim (round vecchi)',rec:'Rinculo'};
  var CA={hit:function(r){return r.a+r.b;},trk:function(r){return r.trk;},swi:function(r){return r.swi;},pre:function(r){return r.pre;},rec:function(r){return r.rec;}};
  var acc={};
  rs.forEach(function(r){
    var c=comps(r),w=0;
    c.forEach(function(x){w+=x[1];});
    c.forEach(function(x){
      var o=acc[x[0]]||(acc[x[0]]={id:x[0],name:CN[x[0]],max:0,lost:0,avg:0,n:0});
      o.max+=x[1]/w*100;o.lost+=x[1]/w*100*(1-Math.max(0,Math.min(1,x[2])));o.avg+=CA[x[0]](r);o.n++;
    });
  });
  A.losses=Object.keys(acc).map(function(k){
    var o=acc[k];o.max/=o.n;o.lost/=o.n;o.avg/=o.n;return o;
  }).sort(function(a,b){return b.lost-a.lost;});

  A.caps=groupBy(ss,function(r){return r.setup.rcap;}).sort(function(a,b){return b.score-a.score;});
  A.kits=groupBy(rs,kitLabel).sort(function(a,b){return (b.score-a.score)||(b.n-a.n);});
  A.kits.forEach(function(k){
    var rec=k.rs.filter(function(r){return r.rec!==null&&r.rec!==undefined;});
    k.rec=rec.length?mean(rec.map(function(r){return 100*r.rec/(r.recN||10);})):null;
    k.recn=rec.length;
  });
  if(A.kits.length>=2){
    var k2=A.kits.filter(function(k){return k.n>=2;});
    if(k2.length>=2){
      var diff=k2[0].score-k2[k2.length-1].score;
      A.bestKit={a:k2[0],b:k2[k2.length-1],diff:diff,real:diff>=T};
    }
  }

  return A;
}

/* ---------- grafici ---------- */
function lgItem(cls,label){return '<span class="lg-i"><i class="'+cls+'"></i>'+esc(label)+'</span>';}
function chartHtml(st){
  var def=st.def,rs=st.rounds;
  if(!rs.length)return '<p class="note">Dopo il primo round vedi qui dove cade il tuo equilibrio.</p>';
  var W=360,H=200,L=34,R=14,T0=22,B=26,pw=W-L-R,ph=H-T0-B;
  var xs=rs.map(function(r){return r.value;});
  if(st.status==='done'&&st.final!==null)xs.push(st.final);
  else if(st.next!==null)xs.push(st.next);
  var xmin=Math.min.apply(null,xs),xmax=Math.max.apply(null,xs);
  var padx=Math.max(2,Math.round((xmax-xmin)*0.18));
  xmin-=padx;xmax+=padx;
  var Y=Math.max(4,Math.max.apply(null,rs.map(function(r){return Math.abs(r.d);}))+1);
  function X(v){return L+(v-xmin)/(xmax-xmin)*pw;}

function trendChart(A){
  var D=A.days,W=360,H=206,L=30,R=64,T0=16,B=28,pw=W-L-R,ph=H-T0-B,n=D.length;
  var sc=A.rs.map(function(r){return r.score;}),mn=Math.min.apply(null,sc),mx=Math.max.apply(null,sc);
  var lo=Math.max(0,Math.floor((mn-4)/10)*10),hi=Math.min(100,Math.ceil((mx+4)/10)*10);
  if(hi-lo<30){hi=Math.min(100,lo+30);lo=Math.max(0,hi-30);}
  var step=(hi-lo)<=40?10:20;
  function Y(s){return T0+ph-(s-lo)/(hi-lo)*ph;}
  var slot=pw/n;
  function X(i){return L+(i+0.5)*slot;}
  var bk=A.best?A.best.c.key:null;
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Punteggio dei round giorno per giorno, da '+esc(dm(D[0].day))+' a '+esc(dm(D[n-1].day))+'">';
  var v;
  for(v=lo;v<=hi;v+=step)s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>';
  s+='<line class="avgline" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(A.avg)+'" y2="'+Y(A.avg)+'"/><text x="'+(W-R+5)+'" y="'+(Y(A.avg)+4)+'">media '+nf(A.avg,0)+'</text>';
  var mute='',best='';
  D.forEach(function(d,i){
    var m=d.n,gap=Math.min(7,slot*0.6/Math.max(m,1));
    d.rs.forEach(function(r,j){
      var cx=X(i)+(j-(m-1)/2)*gap,isB=bk&&r.setup&&comboKey(r.setup)===bk;
      var c='<circle class="dot'+(isB?' best':'')+'" cx="'+cx+'" cy="'+Y(r.score)+'" r="'+(isB?5:4)+'"/>';
      if(isB)best+=c;else mute+=c;
    });
  });
  s+=mute;
  if(n>1)s+='<path class="line" d="'+D.map(function(d,i){return (i?'L':'M')+X(i)+' '+Y(d.avg);}).join(' ')+'"/>';
  s+='<circle class="lend" cx="'+X(n-1)+'" cy="'+Y(D[n-1].avg)+'" r="4.5"/>';
  s+=best;
  s+='<text class="v" x="'+X(n-1)+'" y="'+(Y(D[n-1].avg)-10)+'" text-anchor="middle">'+nf(D[n-1].avg,0)+'</text>';
  var stp=Math.max(1,Math.ceil((n-1)/5)),last=-9;
  D.forEach(function(d,i){
    if(i%stp===0||i===n-1){
      if(i===n-1&&i-last<stp*0.6&&last>=0)return;
      last=i;
      s+='<text x="'+X(i)+'" y="'+(H-9)+'" text-anchor="middle">'+esc(dm(d.day))+'</text>';
    }
  });
  s+='<line id="an-xh" class="xh" x1="0" x2="0" y1="'+T0+'" y2="'+(T0+ph)+'" style="visibility:hidden"/>';
  s+='<rect class="hit-all" x="'+L+'" y="'+T0+'" width="'+pw+'" height="'+ph+'" tabindex="0" role="group" aria-label="Scorri i giorni con le frecce per leggere il dettaglio"/></svg>';
  anTrend={tips:D.map(tipDay),xs:D.map(function(d,i){return X(i);}),pw:pw,slot:slot};
  anTrendI=n-1;
  return s;
}

/* ---------- modello delle sensibilità ---------- */
/* Per ogni sensibilità prendo tutti i round di flick fatti su quella sensibilità e metto in relazione il valore usato con superate − corte.
   Una retta ai minimi quadrati dice dove le due cose si pareggiano: è il valore di comfort.
   La stessa retta dice fin dove puoi salire prima di superare la testa più di LIM_OVER volte su 20: è l'obiettivo di velocità.
   Poi correggo il comfort con il punteggio (se un altro valore rende chiaramente di più) e, per la verticale, con il rinculo. */
var LIM_OVER=2;
function fitLine(pts){
  var n=pts.length;
  if(n<2)return null;
  var mx=mean(pts.map(function(p){return p[0];})),my=mean(pts.map(function(p){return p[1];}));
  var sxx=0,sxy=0,syy=0;
  pts.forEach(function(p){sxx+=(p[0]-mx)*(p[0]-mx);sxy+=(p[0]-mx)*(p[1]-my);syy+=(p[1]-my)*(p[1]-my);});
  if(sxx===0)return null;
  var b=sxy/sxx,a=my-b*mx;
  return {a:a,b:b,r2:(syy>0)?(sxy*sxy)/(sxx*syy):1,n:n};
}
function focusOf(r){return r.focus||(SENS_KEYS.indexOf(r.stage)>-1?r.stage:null);}
function sensModel(A,P){
  var out={};
  SENS_KEYS.forEach(function(k){
    var now=P.vals[k];
    var F=A.rs.filter(function(r){return focusOf(r)===k;}).map(function(r){
      var x=(r.setup&&r.setup[k]!==undefined)?r.setup[k]:r.value;
      return {x:x,d:r.d};
    }).filter(function(p){return p.x!==null&&p.x!==undefined;});
    var m={k:k,now:now,n:F.length,pts:F,fit:null,eq:null,limit:null,comfort:null,target:null,conf:'–',est:false,perf:null,ring:null,ringUp:false};
    if(!F.length){out[k]=m;return;}
    var xs=uniq(F.map(function(p){return p.x;}));
    var fit=(xs.length>=2)?fitLine(F.map(function(p){return [p.x,p.d];})):null;
    if(fit&&fit.b>0.05){
      m.fit=fit;m.eq=-fit.a/fit.b;m.limit=(LIM_OVER-fit.a)/fit.b;
    }else{
      var by={};
      F.forEach(function(p){(by[p.x]=by[p.x]||[]).push(p.d);});
      var v0=Number(Object.keys(by).sort(function(a,b){return by[b].length-by[a].length;})[0]);
      var md=mean(by[v0]);
      m.v0=v0;m.md=md;m.est=true;
      m.eq=(Math.abs(md)<=TOL)?v0:clampV(v0+(md>0?-stepFor(v0,md):stepFor(v0,md)));
    }
    var lo=Math.min.apply(null,xs),hi=Math.max.apply(null,xs);
    m.eq=Math.max(lo*0.8,Math.min(hi*1.2,m.eq));
    var comfort=Math.round(m.eq);
    var q=A.params[k];
    if(q&&q.best&&!q.weak&&q.items.length>=2){
      var near=q.items.reduce(function(b,it){return Math.abs(it.v-comfort)<Math.abs(b.v-comfort)?it:b;},q.items[0]);
      if(q.best.v!==comfort&&q.best.score-near.score>=A.T){
        m.perf={v:q.best.v,gain:q.best.score-near.score,from:comfort};
        comfort=Math.round((comfort+q.best.v)/2);
      }
    }
    if(k==='v'){
      var R=A.rs.filter(function(r){return r.ring!==null&&r.ring!==undefined;});
      if(R.length>=3){
        m.ring={mean:mean(R.map(function(r){return r.ring;})),n:R.length};
        if(m.ring.mean>=2){
          var up=Math.max(1,Math.round(comfort*0.05));
          var cap=(m.limit!==null)?Math.floor(m.limit):comfort+up;
          var nv=Math.min(comfort+up,Math.max(comfort,cap));
          if(nv>comfort){comfort=nv;m.ringUp=true;}
        }
      }
    }
    m.comfort=clampV(comfort);
    if(m.limit!==null){
      var t=Math.min(Math.floor(m.limit),Math.round(m.comfort*1.15));
      m.target=Math.max(m.comfort,clampV(t));
    }else{
      m.target=clampV(m.comfort+Math.max(1,Math.round(m.comfort*0.05)));
      m.targetEst=true;
    }
    m.step=Math.max(1,Math.round(m.comfort*0.04));
    m.next=Math.min(m.target,m.comfort+m.step);
    m.conf=(F.length>=6&&xs.length>=3&&m.fit&&m.fit.r2>=0.3)?'alta':((F.length>=3&&xs.length>=2&&m.fit)?'media':'bassa');
    out[k]=m;
  });
  return out;
}
function whyLine(m){
  var p=[];
  if(m.fit)p.push('Su '+cnt(m.n,'round di flick','round di flick')+' superate e corte si pareggiano a '+nf(m.eq,1)+'.');
  else p.push('Su '+cnt(m.n,'round di flick','round di flick')+' a '+m.v0+' superate meno corte vale '+sgn(m.md)+' su 20.');
  if(m.perf)p.push('Con '+m.perf.v+' fai '+nf(m.perf.gain,0)+' punti in più: mi sposto a metà strada.');
  if(m.ringUp)p.push('Il rinculo ti alza il mirino fino al '+nf(m.ring.mean,1)+'° anello: un po\' di verticale in più lo compensa.');
  return p.join(' ');
}
function balanceChart(m){
  var W=360,H=176,L=30,R=14,T0=24,B=24,pw=W-L-R,ph=H-T0-B;
  var xs=m.pts.map(function(p){return p.x;}).concat([m.now,m.comfort,m.target]);
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),pad=Math.max(2,(x1-x0)*0.15);
  x0-=pad;x1+=pad;
  var Y=Math.max(4,Math.max.apply(null,m.pts.map(function(p){return Math.abs(p.d);}))+1);
  function X(v){return L+(v-x0)/(x1-x0)*pw;}
  function Yp(d){return T0+ph/2-(d/Y)*(ph/2);}
  var id='cp-'+m.k;
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Superate meno corte per ogni valore di '+esc(stageById(m.k).name)+', con la retta di equilibrio">'+
    '<defs><clipPath id="'+id+'"><rect x="'+L+'" y="'+T0+'" width="'+pw+'" height="'+ph+'"/></clipPath></defs>';
  s+='<rect class="band" x="'+L+'" y="'+Yp(TOL)+'" width="'+pw+'" height="'+(Yp(-TOL)-Yp(TOL))+'"/>';
  s+='<line class="zero" x1="'+L+'" x2="'+(W-R)+'" y1="'+Yp(0)+'" y2="'+Yp(0)+'"/>';
  [Y,-Y].forEach(function(v){s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Yp(v)+'" y2="'+Yp(v)+'"/><text x="'+(L-6)+'" y="'+(Yp(v)+4)+'" text-anchor="end">'+(v>0?'+':'−')+Math.abs(v)+'</text>';});
  s+='<text x="'+(L-6)+'" y="'+(Yp(0)+4)+'" text-anchor="end">0</text>';
  if(m.fit)s+='<line class="fit" clip-path="url(#'+id+')" x1="'+X(x0)+'" y1="'+Yp(m.fit.a+m.fit.b*x0)+'" x2="'+X(x1)+'" y2="'+Yp(m.fit.a+m.fit.b*x1)+'"/>';
  var mk=[{v:m.now,c:'mk-now'},{v:m.target,c:'mk-tg'},{v:m.comfort,c:'mk-cf'}];
  mk.forEach(function(q){s+='<line class="'+q.c+'" x1="'+X(q.v)+'" x2="'+X(q.v)+'" y1="'+T0+'" y2="'+(T0+ph)+'"/>';});
  var seen={};
  m.pts.forEach(function(p){
    var key=p.x+'|'+p.d,j=(seen[key]=(seen[key]||0)+1)-1;
    s+='<circle class="pt" cx="'+(X(p.x)+j*5)+'" cy="'+Yp(p.d)+'" r="4.5"/>';
  });
  var placed=[],lab='';
  [{v:m.comfort,c:'v'},{v:m.target,c:''},{v:m.now,c:''}].forEach(function(q){
    var x=X(q.v);
    for(var i=0;i<placed.length;i++){if(Math.abs(placed[i]-x)<22)return;}
    placed.push(x);
    lab+='<text'+(q.c?' class="v"':'')+' x="'+x+'" y="'+(T0-8)+'" text-anchor="middle">'+q.v+'</text>';
  });
  return s+lab+'</svg>';
}

function sensGoals(M){
  var rows=SENS_KEYS.map(function(k){
    var m=M[k],d=stageById(k);
    if(m.comfort===null)return '';
    var plan=(m.target<=m.comfort)?'Sei già al limite: più su superi la testa.'
      :('Prossimo passo '+m.next+', poi +'+m.step+' alla volta fino a '+m.target+'. Sali solo dopo 3 sessioni senza calo di punteggio.');

/* ---------- scheda Cappette ---------- */
/* Una riga per ogni sessione fatta con quella cappetta: il confronto vale solo se ogni cappetta ha almeno due round. */
function capRounds(){
  return state.rounds.map(deco).filter(function(r){return r.setup;});
}
function capSessions(L){
  var by={},ord=[];
  L.forEach(function(r){
    var k=r.day||'senza data';
    if(!by[k]){by[k]=[];ord.push(k);}
    by[k].push(r);
  });
  return ord.sort().reverse().map(function(k){
    var R=by[k];
    return {day:k,n:R.length,avg:mean(R.map(function(r){return r.score;})),
      combos:uniq(R.map(function(r){return comboLabel(r.setup);})),
      kits:uniq(R.map(kitLabel).filter(Boolean)),
      rec:(function(){var x=R.filter(function(r){return r.rec!==null&&r.rec!==undefined;});return x.length?mean(x.map(function(r){return 100*r.rec/(r.recN||10);})):null;})(),
      rs:R};
  });
}
function capData(){
  var rs=capRounds();
  return CAPS.map(function(c){
    var L=rs.filter(function(r){return r.setup.rcap===c.id;});
    var rec=L.filter(function(r){return r.rec!==null&&r.rec!==undefined;});
    return {id:c.id,name:c.name,n:L.length,
      days:uniq(L.map(function(r){return r.day;}).filter(Boolean)).length,
      score:L.length?mean(L.map(function(r){return r.score;})):null,
      hits:L.length?mean(L.map(function(r){return r.hits;})):null,
      trk:L.length?mean(L.map(function(r){return r.trk;})):null,
      pre:L.length?mean(L.map(function(r){return r.pre;})):null,
      rec:rec.length?mean(rec.map(function(r){return 100*r.rec/(r.recN||10);})):null,
      d:L.length?mean(L.map(function(r){return r.d;})):null,
      sessions:capSessions(L),rs:L};
  });
}
function capVerdict(D,T){
  var ok=D.filter(function(c){return c.n>=2;});
  if(ok.length<2){
    var any=D.filter(function(c){return c.n>0;});
    if(!any.length)return 'Non hai ancora round con il setup registrato: monta una cappetta e registra una sessione.';
    if(ok.length===1)return 'Per ora solo '+ok[0].name+' ha abbastanza round. Provane un\'altra per almeno due sere per poterle confrontare.';
    return 'Serve almeno un paio di round per cappetta: per ora i numeri non bastano per un confronto.';
  }
  var srt=ok.slice().sort(function(a,b){return b.score-a.score;});
  var a=srt[0],b=srt[srt.length-1],diff=a.score-b.score;
  return 'Meglio con <b>'+esc(a.name)+'</b>: media '+nf(a.score,0)+' su '+esc(cnt(a.n,'round','round'))+', contro '+nf(b.score,0)+' di '+esc(b.name)+'. '+
    (diff>=T?('Differenza di '+nf(diff,1)+' punti, sopra il rumore normale ('+nf(T,1)+'): tienila.')
            :('Differenza di soli '+nf(diff,1)+' punti, sotto il rumore normale ('+nf(T,1)+'): scegli quella più comoda.'));
}
function capCard(c,P){
  var inUse=(state.gear.rcap===c.id),chosen=(P.finished&&P.vals.cap===c.id);
  var head='<div class="stg-h"><h3>'+esc(c.name)+'</h3>'+
    (inUse?'<span class="st-chip cur">Montata ora</span>':'')+(chosen&&!inUse?'<span class="st-chip done">Scelta dal percorso</span>':'')+'</div>';
  var kpis='<div class="kpis"><div class="kpi"><span class="k">Sessioni</span><span class="n">'+c.sessions.length+'</span></div>'+
    '<div class="kpi"><span class="k">Round</span><span class="n">'+c.n+'</span></div>'+
    '<div class="kpi"><span class="k">Punti</span><span class="n">'+(c.score===null?'–':nf(c.score,0))+'</span></div>'+
    '<div class="kpi"><span class="k">Rinculo</span><span class="n">'+(c.rec===null?'–':nf(c.rec,0)+'%')+'</span></div></div>';
  var det2=c.n?('<div class="kv"><div><span class="k">Teste su 20</span><span class="x">'+nf(c.hits,1)+'</span></div>'+
    '<div><span class="k">Tracking · Pre-aim</span><span class="x">'+nf(c.trk,1)+' · '+nf(c.pre,1)+'</span></div>'+
    '<div><span class="k">Superate − corte</span><span class="x">'+sgn(c.d)+'</span></div></div>'):'';
  var slots;
  if(c.sessions.length){
    slots='<div class="tw"><table><thead><tr><th>Sessione</th><th>Round</th><th>Punti</th><th>Sensibilità</th><th>Operatore e arma</th></tr></thead><tbody>'+
      c.sessions.map(function(s){
        return '<tr><td>'+esc(s.day==='senza data'?'senza data':fmtD(parseKey(s.day)))+'</td><td class="num">'+s.n+'</td><td class="num">'+nf(s.avg,0)+'</td>'+
          '<td class="num">'+esc(s.combos.join(' ; '))+'</td><td>'+esc(s.kits.join(' ; ')||'–')+'</td></tr>';
      }).join('')+'</tbody></table></div>';
  }else{
    slots='<div class="slot-empty"><span>Nessuna sessione con questa cappetta.</span><span class="hint">Montala, poi registra un round dalla scheda Oggi: la sessione compare qui.</span></div>';
  }
  var btn=inUse?'<p class="hint">È quella montata adesso: i prossimi round finiscono qui.</p>'
    :'<button class="btn ghost" data-act="setcap" data-v="'+c.id+'" type="button">Monto questa</button>';
  return '<section class="card stg">'+head+kpis+det2+slots+btn+'</section>';
}
function renderCaps(P){
  var D=capData(),T=P.T;
  var sc=D.filter(function(c){return c.score!==null;}).map(function(c){return c.score;});
  var mx=sc.length?Math.max.apply(null,sc):0;
  var best=null;
  D.forEach(function(c){if(c.n>=2&&(!best||c.score>best.score))best=c;});
  var bars='<div class="hb">'+D.map(function(c){
    var pct=(c.score===null||!mx)?0:(c.score/100)*100;
    return hbRow(c.name,c.n?cnt(c.n,'round','round')+' · '+cnt(c.sessions.length,'sessione','sessioni'):'mai usata',
      pct,(best&&best.id===c.id?'best':'')+(c.n===1?' thin':''),c.score===null?'–':nf(c.score,0));
  }).join('')+'</div>';
  var noSetup=state.rounds.length-capRounds().length;
  return '<section class="card"><h2>Le quattro cappette</h2>'+
    '<p class="note">Punteggio medio con ogni cappetta dello stick destro, da 0 a 100.</p>'+bars+
    '<p>'+capVerdict(D,T)+'</p>'+
    (noSetup?'<p class="hint">'+esc(cnt(noSetup,'round più vecchio non ha','round più vecchi non hanno'))+' la cappetta registrata: non compaiono qui.</p>':'')+
    '</section><div class="grid2">'+D.map(function(c){return capCard(c,P);}).join('')+'</div>';
}

function undo(){
  var r=state.rounds[state.rounds.length-1];
  if(!r)return false;
  if(state.locks[r.stage]!==undefined){delete state.locks[r.stage];return true;}
  if(r.stage==='cap'&&state.manual.cap){delete state.manual.cap;return true;}
  state.rounds.pop();
  return true;
}
function redoStage(id){
  var drop=STAGE_IDS.slice(stageIdx(id));
  state.rounds=state.rounds.filter(function(r){return drop.indexOf(r.stage)<0&&r.stage!=='free';});
  drop.forEach(function(k){delete state.locks[k];});
  if(drop.indexOf('cap')>-1)delete state.manual.cap;
}
function trendAt(i){
  var G=anTrend;
  if(!G)return;
  i=Math.max(0,Math.min(G.tips.length-1,i));
  anTrendI=i;
  var ro=$('ro-trend'),xh=$('an-xh');
  if(ro)ro.textContent=G.tips[i];
  if(xh){xh.setAttribute('x1',G.xs[i]);xh.setAttribute('x2',G.xs[i]);xh.style.visibility='visible';}
}
function trendEvt(e){
  var t=e.target;
  if(!anTrend||!t||!t.classList||!t.classList.contains('hit-all'))return;
  var r=t.getBoundingClientRect();
  if(!r.width)return;
  trendAt(Math.floor((e.clientX-r.left)/r.width*anTrend.pw/anTrend.slot));
}

  if(go){go.disabled=true;go.textContent='Un attimo…';}
  authErr='';
  (sign?doSignup(mail,pw,rem):doLogin(mail,pw,rem)).then(function(mig){
    users=loadUsers();
    authErr='';render();
    toast(sign?(mig?'Utente creato: i round di prima sono tuoi':'Utente creato'):'Bentornato');
  },function(x){fail((x&&x.message)||'Non ci sono riuscito.');});
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el||el.tagName==='SELECT'||el.tagName==='INPUT')return;
  var a=el.dataset.act,P,st,k,v;
  if(a==='authmode'){authMode=(authMode==='signup')?'login':'signup';authErr='';render();return;}
  if(a==='logout'){logout();toast('Sei uscito');return;}
  if(!me)return;
  if(a==='tab'){tab=el.dataset.t;render();toTop();return;}
  if(a==='start'){state.seen=1;commit();return;}
  if(a==='dstep'){dstep=clampInt(el.dataset.i,0,ND-1);render();return;}
  if(a==='tgo'){if(T[dstep].running)tPause(dstep);else tStart(dstep);return;}
  if(a==='treset'){tReset(dstep);return;}
  if(a==='demo'){demoPaused=!demoPaused;render();return;}
  if(a==='rate'){ensureDraft();draft[el.dataset.k]=Number(el.dataset.v);saveDraft();render();return;}
  if(a==='ring'){ensureDraft();v=Number(el.dataset.v);draft.ring=(draft.ring===v)?null:v;saveDraft();render();return;}
  if(a==='drift'){ensureDraft();v=Number(el.dataset.v);draft.drift=(draft.drift===v)?null:v;saveDraft();render();return;}
  if(a==='focus'){ensureDraft();draft.focus=el.dataset.s;saveDraft();render();return;}
  if(a==='num'){
    ensureDraft();
    k=el.dataset.k;
    var d=Number(el.dataset.d);
    if(k==='swi'){draft.swi=clampInt((draft.swi===null?0:draft.swi)+d,0,10);}
    else if(k==='mag'){
      draft.mag=clampInt(draft.mag+d,1,120);
      if(draft.rec!==null)draft.rec=Math.min(draft.rec,draft.mag);
    }
    else if(k==='rec'){draft.rec=clampInt((draft.rec===null?0:draft.rec)+d,0,draft.mag);}
    else{
      if(draft.a===null)draft.a=0;
      if(draft.b===null)draft.b=0;
      var o2=(k==='a')?'b':'a';
      draft[k]=Math.max(0,Math.min(20-draft[o2],draft[k]+d));
    }
    saveDraft();render();return;
  }
  if(a==='sens'){
    ensureDraft();P=computePlan();
    k=el.dataset.k;
    var cur=(draft.sens[k]!==undefined)?draft.sens[k]:P.vals[k];
    draft.sens[k]=clampV(cur+Number(el.dataset.d));
    saveDraft();render();return;
  }
  if(a==='sensreset'){ensureDraft();draft.sens={};saveDraft();render();return;}
  if(a==='optx'){
    P=computePlan();
    k=el.dataset.k;
    var ov=opticVals(Object.assign({},P.vals,usedSens(P)));
    state.optx[k]=clampV(ov[k]+Number(el.dataset.d));
    commit();return;
  }
  if(a==='optxreset'){state.optx={};commit();return;}
  if(a==='gearn'){
    k=el.dataset.k;
    var lim=(k==='rm'||k==='lm')?[-10,10]:[0,30];
    var g=Object.assign({},state.gear);
    g[k]=Math.max(lim[0],Math.min(lim[1],g[k]+Number(el.dataset.d)));
    state.gear=normGear(g);
    commit();return;
  }
  if(a==='save'){
    P=computePlan();
    ensureDraft();
    if(draft.trk===null||draft.a===null||draft.b===null||draft.swi===null||draft.rec===null)return;
    var maint=P.finished,idx=P.cur,def=maint?null:P.stages[P.cur].def;
    var used=usedSens(P),setup=Object.assign({},state.gear);
    SENS_KEYS.forEach(function(q){setup[q]=used[q];});
    setup.optx=opticVals(Object.assign({},P.vals,used));
    var now=new Date();
    var round={stage:maint?'free':def.id,value:null,a:draft.a,b:draft.b,trk:draft.trk,pre:null,swi:draft.swi,rec:draft.rec,recN:draft.mag,
      ring:draft.ring,drift:draft.drift,
      op:txt(draft.op),wep:txt(draft.wep),at:fmtD(now),day:dkey(now),ts:now.getTime(),setup:normSetup(setup),focus:null};
    if(maint)round.focus=draft.focus||'h';
    else if(def.kind==='cap')round.value=state.gear.rcap;
    else{round.value=used[def.id];round.focus=def.id;}
    state.rounds.push(round);
    state.kit={op:round.op,wep:round.wep,mag:draft.mag};
    state.seen=1;
    var keepF=maint?round.focus:null;
    draft=blankDraft();draft.focus=keepF;saveDraft();dstep=0;tResetAll();
    commit();
    var msg='Round salvato';
    if(!maint){
      var s2=computePlan().stages[idx];
      msg=s2.done?('Fase chiusa: '+fv(s2.def.id,s2.final)):('Prossimo numero: '+(s2.def.kind==='cap'?capName('convessa'):s2.next));
    }
    toast(msg);toTop();
    return;
  }
  if(a==='lock'){
    P=computePlan();
    if(P.finished)return;
    st=P.stages[P.cur];
    if(st.def.kind==='cap'||!st.rounds.length)return;
    state.locks[st.def.id]=st.rounds[st.rounds.length-1].value;
    commit();toast('Fase chiusa: '+state.locks[st.def.id]);toTop();return;
  }
  if(a==='setcap'){
    state.gear=normGear(Object.assign({},state.gear,{rcap:el.dataset.v}));
    commit();toast('Montata: '+capName(el.dataset.v));return;
  }
  if(a==='view'){viewStage=el.dataset.s;render();return;}
  if(a==='day'){calDay=el.dataset.k;render();return;}
  if(a==='cal'){
    var dd=Number(el.dataset.d);
    if(dd===0){var n0=new Date();calMonth=new Date(n0.getFullYear(),n0.getMonth(),1);calDay=dkey(n0);}
    else calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+dd,1);
    render();return;
  }
  if(a==='anp'){
    anP=el.dataset.p;
    if(anP==='custom'&&!anFrom&&!anTo){
      var ds=state.rounds.filter(function(r){return r.day;}).map(function(r){return r.day;}).sort();
      if(ds.length){anFrom=ds[0];anTo=ds[ds.length-1];}
    }
    render();return;
  }
  if(a==='applycomfort'){
    P=computePlan();
    if(!P.finished)return;
    var Mx=sensModel(analyze(P),P),nch=0;
    SENS_KEYS.forEach(function(q){if(Mx[q].comfort!==null){state.carry[q]=Mx[q].comfort;nch++;}});
    if(nch){draft=blankDraft();saveDraft();commit();toast('Valori di comfort applicati');}
    return;
  }
  if(a==='applytweak'){
    state.carry[el.dataset.k]=clampInt(el.dataset.v,1,100);
    draft=blankDraft();saveDraft();
    commit();toast(stageById(el.dataset.k).tab+': '+state.carry[el.dataset.k]);return;
  }
  if(a==='copy'){
    var tc=$('bk');
    if(!tc)return;
    tc.focus();tc.select();
    var done=false;
    try{done=document.execCommand('copy');}catch(e){}
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(tc.value).then(function(){},function(){});
        done=true;
      }
    }catch(e){}
    toast(done?'Backup copiato':'Seleziona il testo e copialo a mano');
    return;
  }
  if(a==='import'){
    var ta=$('bk-in');
    if(!ta||!ta.value.trim()){toast('Incolla prima il backup');return;}
    try{
      var o3=JSON.parse(ta.value);
      var ns=normalize(o3);
      ns.rev=Math.max(state.rev,ns.rev)+1;
      state=ns;draft=blankDraft();saveDraft();
      saveLocal();
      render();toast('Backup caricato');
    }catch(e2){toast('Backup non valido');}
    return;
  }
  if(a==='undo'){
    if(arm!=='undo'){armFor('undo');return;}
    arm=null;
    if(undo()){draft=blankDraft();saveDraft();commit();toast('Annullato');}
    return;
  }
  if(a==='redo'){
    k='redo:'+el.dataset.s;
    if(arm!==k){armFor(k);return;}
    arm=null;redoStage(el.dataset.s);draft=blankDraft();saveDraft();commit();toast('Fase da rifare');return;
  }
  if(a==='reset'){
    if(arm!=='reset'){armFor('reset');return;}
    arm=null;
    var next=defaultState();next.rev=state.rev+1;next.gear=state.gear;next.seen=1;
    state=next;draft=blankDraft();saveDraft();viewStage=null;
    saveLocal();
    render();toast('Azzerato');
  }
});

(function fillLists(){
  var a=$('dl-op'),b=$('dl-wep');
  if(a)a.innerHTML=OPS.map(function(o){return '<option value="'+esc(o)+'"></option>';}).join('');
  if(b)b.innerHTML=WEPS.map(function(o){return '<option value="'+esc(o)+'"></option>';}).join('');
})();
render();
initStore();
})();
</script>
