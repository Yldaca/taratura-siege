te":"Entra")+'</h2><p class="note">'+(t?"Email e password restano su questo dispositivo e chiudono i tuoi dati a chiave.":"Bentornato: inserisci email e password.")+"</p>"+n+'<form id="au-f" class="auth-f" autocomplete="on"><label><span class="lbl">Email</span><input class="txt-in" type="email" id="au-mail" value="'+h(t?"":e)+'" autocomplete="username" required></label><label><span class="lbl">Password</span><input class="txt-in" type="password" id="au-pw" autocomplete="'+(t?"new-password":"current-password")+'" required></label>'+(t?'<label><span class="lbl">Ripeti la password</span><input class="txt-in" type="password" id="au-pw2" autocomplete="new-password" required></label>':"")+'<label class="chk"><input type="checkbox" id="au-rem"'+(t?"":" checked")+'> Resta collegato su questo dispositivo</label><button class="btn pri big block" type="submit" id="au-go">'+(t?"Crea utente ed entra":"Entra")+'</button></form><p class="warn-t" id="au-err" role="alert">'+h(i.authErr)+'</p><button class="btn ghost block" data-act="authmode" type="button">'+(t?"Ho già un utente: entra":"Non ho un utente: creane uno")+"</button>"+a+'<p class="hint">'+(nt?"I tuoi dati sono cifrati con la password, qui dentro.":"Attenzione: questo browser non può cifrare, i dati restano in chiaro.")+"</p></section>"}const xe=(t,e,a)=>'<div class="g-tab"><div class="g-tab-h"><span class="g-ico" aria-hidden="true">'+t+"</span><h3>"+e+"</h3></div>"+a+"</div>";function sc(t){const e=`<section class="card guide"><h2>Come funziona</h2><ol class="how num"><li><b>Scrivi i numeri che hai nel gioco</b> nella scheda Oggi, nel riquadro «I numeri che hai nel gioco». Ogni volta che li cambi nel gioco, cambiali anche qui.</li><li><b>Allenati nel poligono di tiro</b>: 4 esercizi, circa 15 minuti, sempre con L2 premuto. Salva il round: ti dico il numero da provare dopo.</li><li><b>Gioca le classificate.</b> Arrivano da sole (basta il tuo ID PlayStation nel profilo) e mi dicono con quale numero giochi meglio.</li><li><b>Guarda i Consigli</b>: il numero giusto per ogni mirino, da allenamento e partite insieme.</li></ol><p class="note">Si parte dal mirino 1.0x che hai già nel gioco (se non lo scrivi, da 50, il valore iniziale del gioco). 2.5x, 3.5x e 8.0x li calcolo dall'1.0x con la guida Ubisoft: un po' più alti, perché il gioco li rallenta già da solo quando ingrandiscono.</p></section>`,a='<section class="card guide"><h2>Cosa trovi in ogni scheda</h2><div class="g-tabs">'+xe('<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.5"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg>',"Oggi","<p>Il numero da mettere nel gioco per il prossimo round, i numeri che hai nel gioco adesso e gli esercizi da fare. In fondo, «Salva round». Con «Avvia la sessione guidata» fai tutto a schermo intero, passo per passo.</p>")+xe('<svg viewBox="0 0 24 24"><path d="M7.5 8h9a4.5 4.5 0 0 1 4.4 5.5l-.9 4a2.6 2.6 0 0 1-4.5 1.1L14 17h-4l-1.5 1.6A2.6 2.6 0 0 1 4 17.5l-.9-4A4.5 4.5 0 0 1 7.5 8z"/><path d="M8 11.5v3M6.5 13h3"/><circle cx="15.5" cy="12" r=".6"/><circle cx="17" cy="14" r=".6"/></svg>',"Partite","<p>Le tue classificate, da sole. In alto i totali; poi il grafico serata per serata con, sotto, il mirino 1.0x che usavi; poi ogni serata con una riga per partita: esito, uccisioni, morti e colpi in testa.</p>")+xe('<svg viewBox="0 0 24 24"><path d="M5 4v16M12 4v16M19 4v16"/><rect x="2.5" y="13" width="5" height="3" rx="1"/><rect x="9.5" y="7" width="5" height="3" rx="1"/><rect x="16.5" y="15" width="5" height="3" rx="1"/></svg>',"Consigli","<p>Il numero consigliato per ogni mirino e, in una riga, il perché. La tabella «Allenamento e partite a confronto» mette affiancati, numero per numero, come vai negli esercizi e in partita. Più sotto i tuoi numeri e i dettagli di ogni mirino.</p>")+xe('<svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M4 16l5-5 4 3 7-8"/><path d="M15 6h5v5"/></svg>',"Progressi","<p>Il calendario degli allenamenti (tocca un giorno per vederne i round), le fasi del percorso con il grafico, le settimane e gli analogici dello stick destro.</p>")+xe('<svg viewBox="0 0 24 24"><circle cx="12" cy="8.6" r="3.7"/><path d="M4.6 20.2c1-3.7 3.9-5.8 7.4-5.8s6.4 2.1 7.4 5.8"/></svg>',"Profilo","<p>L'icona in alto a destra: il tuo account, il tuo ID PlayStation, R6 Tracker, la password e una copia dei tuoi dati.</p>")+"</div></section>",n=`<section class="card guide"><h2>Le parole dell'app</h2><dl class="g-dl"><dt>Oltre e prima</dt><dd>Nel flick il mirino può andare <b>oltre</b> la testa (numero troppo alto) o <b>fermarsi prima</b> (troppo basso).</dd><dt>Equilibrio</dt><dd>Vai oltre e ti fermi prima lo stesso numero di volte: è il numero giusto.</dd><dt>Round</dt><dd>Una volta i 4 esercizi, circa 15 minuti.</dd><dt>Allenamento</dt><dd>I round fatti di fila, a meno di `+$t+" ore uno dall'altro. Il primo è il riscaldamento.</dd><dt>Sessione</dt><dd>Una serata di classificate.</dd><dt>Rumore</dt><dd>Quanto cambiano i risultati da una sera all'altra anche senza toccare niente. Cambio il consiglio solo se la differenza è più grande del rumore.</dd></dl></section>",r=`<section class="card guide"><h2>Regole d'oro</h2><ul class="how"><li>Fai i round che ti dice la scheda Oggi (di solito 3 di fila, il primo è il riscaldamento) e fermati quando dice «per adesso basta».</li><li>Meglio più allenamenti brevi che uno lungo: anche due al giorno, ad almeno `+$t+" ore di distanza, non di più.</li><li>Cambia un mirino alla volta e tienilo almeno due sere.</li><li>Per capire quale di due numeri rende di più in partita, alternali: una sera uno, una sera l'altro.</li><li>Stessi esercizi, stesso operatore e stessa arma.</li><li>Serata storta? Salta il round.</li><li>Numeri nella home sempre uguali a quelli del gioco: così ogni partita va con i numeri giusti.</li></ul></section>",o='<section class="card guide"><h2>Account e telefono</h2><p>Entri con email e password da qualsiasi dispositivo e ritrovi tutto. La password non si può recuperare: se la dimentichi crei un account nuovo.</p><p><b>iPhone</b>, in Safari: Condividi, poi «Aggiungi alla schermata Home». <b>Android</b>, in Chrome: menu ⋮, poi «Installa app».</p><p class="note">Le classificate: il server le legge da R6 Arenyze ogni 15 minuti mentre giochi, ogni 4 ore quando non giochi. Se fra due letture giochi due partite, stanno sulla stessa riga.</p></section>',c=t.sd||Ae,s=Ue(c,t.sdDay),l=ht*s.w,d='<section class="card guide">'+Et("d-calc","more","Come calcolo i numeri (per chi vuole i dettagli)",`<div class="setup-b"><p><b>1. Equilibrio nel flick.</b> Metto i round su un grafico: il numero usato contro (volte oltre − volte prima). La retta ai minimi quadrati pesati (il primo round di ogni allenamento, il riscaldamento, pesa la metà) incrocia lo zero nel punto di equilibrio. Il margine all'80% lo trovo ricampionando i round 400 volte e rifacendo la retta; lo mostro solo da `+rn+" round in su, perché con meno round viene troppo stretto.</p><p><b>2. Punteggio e rumore.</b> 40% colpi in testa nel flick, 20% tracking, 20% transizioni, 20% rinculo. Il rumore è quanto cambia il punteggio fra round fatti con gli stessi numeri (mirini, orizzontale e verticale) e lo stesso analogico: per te ora "+P(c,1)+" punti a round (finché i round sono pochi parto da "+Ae+"). Una differenza fra due medie conta se supera 1,64 volte il suo errore: vuol dire essere sicuri al 90%. L'errore scende con più round, ma i round dello stesso allenamento contano meno di quelli di allenamenti diversi, perché hanno la stessa forma (dettagli qui sotto). Quando scelgo il migliore fra più numeri la soglia sale (1,96 con 3 numeri, 2,13 con 4), perché fra tanti uno sembra migliore anche per caso. Se un altro numero supera la soglia, mi sposto a metà strada.</p><p><b>3. Rinculo.</b> È una regola pratica, non un test: se in almeno 3 round il foro più alto arriva in media al 2° anello o oltre, alzo di circa il 5% (senza superare l'obiettivo di velocità).</p><p><b>4. Partite.</b> Per ogni numero sommo colpi in testa, uccisioni, morti e partite: colpi in testa come proporzione sulle uccisioni, K/D in scala logaritmica, uccisioni a partita come conteggio. Le serate variano più di quanto dicano i conteggi: misuro quanto (sovradispersione) e allargo il margine. Confronto il numero vicino al consiglio con quello che rende di più, a parità degli altri mirini, con almeno 2 sessioni e 4 partite ciascuno: se la differenza supera la soglia al 90% (più alta se hai provato 3 o più numeri) mi sposto verso quel numero, a metà strada, fino all'80% quando è molto netta. Se i due numeri li hai usati in periodi separati mi sposto la metà: in parte potrebbe essere il periodo. Ogni partita va con i numeri che avevi nella home quando l'hai giocata. Le vittorie le mostro ma non decidono.</p><p><b>5. Solo partite.</b> Senza round di flick per un mirino, parto dal numero che usi e mi sposto solo se in partita un altro numero rende chiaramente di più.</p><p><b>6. Obiettivo velocità.</b> Il numero più alto con cui vai oltre la testa al massimo "+En+" volte su 20 più di quante ti fermi prima, fino al 15% sopra il consigliato, a passi di circa il 4%.</p><p><b>7. Gli altri mirini.</b> Consigliato = 1.0x × rapporto. Il rapporto di partenza viene dalla guida Ubisoft sull'ADS: il gioco scala la rotazione con lo zoom, così con lo stesso numero il mirino si muove sullo schermo come all'1.0x, ma solo vicino al centro. Con il campo visivo della console (60° in verticale, schermo 16:9) calcolo il numero con cui arrivi al bordo dello schermo, da dove parte il bersaglio del flick, nello stesso tempo che con l'1.0x: rapporto "+P(Ce("ads25"),2)+" al 2.5x, "+P(Ce("ads35"),2)+" al 3.5x, "+P(Ce("ads8"),2)+" all'8.0x (con 11 all'1.0x: "+Qt(11,"ads25")+", "+Qt(11,"ads35")+", "+Qt(11,"ads8")+"). È una regola di partenza: i tuoi round con quel mirino (fino al 90%) e le partite la rendono tua.</p><p><b>Orizzontale e verticale.</b> Non le taro, ma contano: la velocità con il mirino è la sensibilità normale × quella del mirino, quindi cambiandole cambi anche tutti i mirini. Per questo confronto fra loro solo round e partite fatti con la stessa orizzontale e verticale di adesso.</p><p><b>8. Analogico.</b> 4 round alternati: il tuo, Convesso alto, Convesso alto, il tuo. Così riscaldamento e stanchezza pesano uguale. Confronto i round dello stesso allenamento fra loro, così la forma del momento si cancella; il riscaldamento nel test non conta. Tieni il Convesso alto solo se fa più punti oltre la soglia (ora circa "+P(l,1)+" punti con 2 round per parte); altrimenti resti sul tuo. Con così pochi round si vedono solo differenze grandi: se vuoi, rifai il test. Se hai solo un analogico, spunta «Ho solo questo analogico» (in Oggi o in Progressi): il percorso salta il test e non ti consiglio di cambiarlo.</p><p><b>9. Quanto allenarsi.</b> Ti consiglio "+wr(c,t.sdDay)+" round per allenamento (il primo è il riscaldamento). Il numero viene dai tuoi dati: i round di fila hanno la stessa forma e ognuno dice un po' meno del precedente; mi fermo quando il prossimo varrebbe meno della metà di un round fatto in un altro allenamento. Ti dico «per adesso basta» anche se negli ultimi 2 round il punteggio scende oltre il rumore (stanchezza), e dopo "+Ht+" round di fila. Al massimo "+Sa+" allenamenti al giorno, ad almeno "+$t+` ore: più allenamenti brevi rendono più di uno lungo, sia per misurare sia per imparare.</p><p class="note">Durante il percorso il passo va dal 4% al 20% del numero. L'1.0x si chiude con due round di fila in equilibrio (differenza al massimo `+Mt+"), dopo "+hn+" round, oppure quando lo chiudi tu: il numero del percorso è un punto di partenza (di solito entro ±1 da quello giusto), i round di mantenimento lo affinano. Livelli: 90% per decidere, 80% per i margini che vedi nei grafici, 95% per l'avviso sui due lati del flick.</p></div>")+"</section>",u=v=>'<span class="st-f">'+v+"</span>",p=v=>'<h4 class="st-h">'+v+"</h4>",f='<section class="card guide st">'+Et("d-stat","more","Dettagli statistici: modelli, varianze e covarianze",`<div class="setup-b"><p class="note">n = round, k = allenamenti (round di fila, a meno di 3 ore uno dall'altro), N = partite, K/D/H = uccisioni/morti/colpi in testa, φ = sovradispersione, Δ = differenza fra due medie.</p>`+p("1. Equilibrio nel flick")+"<p>Retta ai minimi quadrati pesati fra il numero x e d = oltre − prima su 20. Pesi: 0,5 al primo round dell'allenamento, min(1, colpi/20) ai blocchi A/B.</p>"+u("x₀ = −a / b   (solo se b &gt; 0,05; x₀ in [0,8·min, 1,2·max] dei numeri provati)")+"<p>Margine 80%: bootstrap percentile dei round, 400 ricampionamenti, almeno 200 con b &gt; 0,05, solo da "+rn+" round. Niente formula Delta: ogni ricampionamento stima a e b insieme, quindi la loro covarianza è già dentro.</p>"+p("2. Punteggio e rumore")+u("punteggio = 100 · Σ peso·valore / Σ peso   (teste/20 0,4 · tracking 0,2 · transizioni 0,2 · rinculo 0,2)")+"<p>Il rumore è misurato sul punteggio totale, quindi le covarianze fra esercizi sono incluse. Modello a due livelli: punteggio = condizioni + allenamento + round (senza i round di riscaldamento).</p>"+u("sd² = (SS + "+ma+"·"+Ae+"²) / (gdl + "+ma+")   gruppi: stessi mirini e analogico, almeno 2 allenamenti")+u("w² = idem nello stesso allenamento (partenza 7),   τ² = max(0, sd² − w²)")+u("Var(media di n round in k allenamenti) = w²/n + τ²/k")+"<p>Per te ora: sd "+P(c,1)+", w "+P(s.w,1)+", τ "+P(s.tau,1)+". I round dello stesso allenamento sono correlati (stessa forma): con τ²/k non contano come indipendenti.</p>"+u("z = Δ / √(Var₁ + Var₂)   decido a |z| ≥ 1,645 (90%)")+"<p>Covarianza 0 fra i due gruppi: sono round diversi. Scegliendo il migliore fra m+1 numeri: z = Φ⁻¹(1 − 0,05/m) (Bonferroni: 1,96 con 3, 2,13 con 4), valido anche se i confronti sono correlati (qui hanno lo stesso riferimento).</p>"+p("3. Analogico: A B B A")+u("d_s = B̄_s − Ā_s,  w_s = 1/(1/nA,s + 1/nB,s),  Δ = Σ w_s·d_s / Σ w_s,  Var(Δ) = w² / Σ w_s")+"<p>Nello stesso allenamento Ā e B̄ hanno covarianza positiva (la forma del momento): la differenza appaiata la toglie invece di ignorarla. Il riscaldamento è escluso. Se nessun allenamento ha tutti e due: Var(Δ) = sd²·(1/nA + 1/nB).</p>"+p("4. Partite")+u("colpi in testa: p̂ = ΣH/ΣK,   Var(p̂) = φ·p(1−p)/ΣK")+"<p>Binomiale condizionata alle uccisioni; p limitata a 0,02–0,98 solo nella varianza.</p>"+u("K/D: l = ln((K+½)/(D+½)),   Var(l) = φ·(1/(K+½) + 1/(D+½))")+"<p>È la formula Delta, ma condizionando sul totale T = K + D: K | T ~ Binomiale(T, q) e l = logit(q̂). C'è una sola variabile casuale, quindi nessuna covarianza trattata come 0: Var(logit q̂) ≈ 1/(T·q(1−q)) = 1/K + 1/D. La dipendenza fra uccisioni e morti da una sera all'altra (sere buone: più K e meno D) fa variare q fra le sere e finisce in φ. Il +½ evita gli zeri (Haldane-Anscombe).</p>"+u("uccisioni a partita: m = ΣK/N,   Var(m) = φ·max(m; 0,5)/N   (Poisson, N = esposizione)")+u("φ = χ² di Pearson / gdl fra le sessioni dello stesso numero, in [1, 6]; 2 senza repliche")+"<p>La prima sessione dopo un cambio entra con i conteggi × 0,5 (verosimiglianza scontata), anche nelle varianze. Due numeri: z = (l_B − l_A)/√(Var_A + Var_B), covarianza 0 perché sono sessioni diverse; soglia 1,645 o Bonferroni. Spostamento del consiglio: min(0,8; 0,5 + 0,25·(z − soglia)), dimezzato se i due numeri sono di periodi separati (la tendenza nel tempo si confonde col numero). Intervalli nei grafici: ±1,28·se (80%), per il K/D ritrasformati con exp.</p>"+p("5. Quanti round per allenamento")+u("informazione di un allenamento con n round di misura ∝ n / (w² + n·τ²)")+u("valore del round n+1 / primo round di un altro allenamento = ρ(ρ+1) / ((ρ+n)(ρ+n+1)),  ρ = w²/τ²")+"<p>Aggiungo round finché questo rapporto è almeno 0,5, più il riscaldamento; massimo "+Ht+". Stanchezza: ultimi 2 round contro i precedenti dello stesso allenamento, z = Δ / (w·√(1/2 + 1/m)) ≤ −1,28. Per te ora ρ = "+(s.tau>0?P(s.w*s.w/(s.tau*s.tau),1):"∞")+".</p>"+p("6. Tendenze e altri te
