<h3>Conta colpo per colpo</h3><p>Nel flick, dopo ogni colpo tocca <b>Prima</b>, <b>In testa</b> o <b>Oltre</b>; nelle transizioni <b>Netto</b> o <b>Non netto</b>. I totali li faccio io e vedo anche se da destra vai diverso che da sinistra.</p></section><section><h3>Distanza</h3><p>Il flick del mirino 1.0x si fa a 10 metri, quelli di 2.5x e 3.5x a 20 metri. Puoi cambiarla: se registri round a distanze diverse, in Consigli vedi come cambia l'equilibrio.</p></section><section><h3>Confronto A/B</h3><p>Nella scheda <b>Test</b> scegli due numeri: li provi nella stessa sera in 4 blocchi da 30 secondi, alternati in ordine casuale, facendo più flick che puoi. Ne escono i colpi in testa al minuto per ciascuno e un verdetto che dice se la differenza è chiara.</p></section><section><h3>Riscaldamento e margine</h3><p>Il primo round di ogni sera conta la metà nel calcolo, perché di solito è il peggiore. Il comfort ha un margine all'80%: se il numero che usi è già dentro, non ti dico di cambiarlo.</p></section><section><h3>Screenshot del bersaglio</h3><p>Nel rinculo puoi caricare uno screenshot del bersaglio a cerchi: tocchi il centro, il bordo e ogni foro, e conto io colpi, anello più alto e direzione. In Consigli trovi la rosa dei colpi di ogni arma.</p></section><section><h3>Partite e controller</h3><p>In <b>Progressi</b> salvi ogni sessione di classificate, con il giorno: % di colpi in testa, K/D e partite (li trovi su R6 Tracker). È la prova che l'allenamento funziona anche in partita. Con le <b>statistiche automatiche</b> le sessioni arrivano da sole: in <b>Progressi</b> scrivi il tuo nome in gioco e scegli la piattaforma, il resto lo fa il server dell'app leggendo i tuoi totali da R6 Arenyze. Non servono l'account PlayStation né la password Ubisoft. In <b>Test</b> misuri la deriva degli stick, quanto arrivano in fondo e quanto sei preciso a fermarti.</p></section><section><h3>Installala sul telefono</h3><p>Dal sito GitHub dell'app. iPhone, in Safari: Condividi, poi "Aggiung
